function addExToSession(phase) {
  G._pickPhase=phase||'workout';
  var activeIds=G.sess?G.sess.exercises.map(function(e){return e.exerciseId;}):[];
  var sessMusclces=G.sess?G.sess.muscles:[];
  var phaseBoost=(phase==='warmup'||phase==='cooldown')?'Cardio':null;
  var grouped={};
  db.exercises.forEach(function(ex){var k=ex.muscles[0]||'Other';if(!grouped[k])grouped[k]=[];grouped[k].push(ex);});
  var sortedKeys=Object.keys(grouped).sort(function(a,b){
    if(phaseBoost&&a===phaseBoost)return -1;if(phaseBoost&&b===phaseBoost)return 1;
    var af=sessMusclces.indexOf(a)>=0,bf=sessMusclces.indexOf(b)>=0;
    if(af&&!bf)return -1;if(bf&&!af)return 1;return a.localeCompare(b);
  });
  function buildPickerHTML(filter){
    filter=(filter||'').toLowerCase();
    return sortedKeys.map(function(muscle,i){
      var isFocused=sessMusclces.indexOf(muscle)>=0||(phaseBoost&&muscle===phaseBoost);
      var exs=grouped[muscle].filter(function(ex){
        if(!filter)return true;
        return ex.name.toLowerCase().indexOf(filter)>=0||ex.muscles.some(function(m){return m.toLowerCase().indexOf(filter)>=0;})||ex.equipment.some(function(e){return eqLabel(e).toLowerCase().indexOf(filter)>=0;});
      });
      if(!exs.length)return '';
      var autoOpen=isFocused||(filter.length>0)||i===0;
      var gid='pg-'+muscle.replace(/\W/g,'');
      var rows=exs.map(function(ex){
        var added=activeIds.indexOf(ex.id)>=0;
        return '<div class="card-row" onclick="pickEx('+ex.id+')" style="border-radius:10px;margin-bottom:3px;background:var(--bg2);border:1px solid var(--border1)">'+
          '<div class="card-body"><div class="card-title">'+ex.name+(added?' <span class="pill pill-teal" style="font-size:10px">Added</span>':'')+'</div>'+
          '<div class="card-sub">'+ex.equipment.map(eqLabel).join(', ')+(ex.positions&&ex.positions.length?' · '+ex.positions.slice(0,2).join('/'):'')+'</div></div>'+
          '<div class="card-right">'+(added?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>')+'</div></div>';
      }).join('');
      return '<div class="pick-group"><div class="pick-group-hdr'+(isFocused?' focused-grp':'')+'" onclick="togglePickGroup(\''+gid+'\',this)">'+
        '<div class="pick-group-lbl'+(isFocused?' focused-txt':'')+'">'+muscle+'<span class="pick-grp-badge'+(isFocused?' focused-badge':'')+'">'+exs.length+'</span></div>'+
        '<svg class="pick-group-chev'+(autoOpen?' open':'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>'+
      '</div><div class="pick-group-body'+(autoOpen?' open':'')+'" id="'+gid+'">'+rows+'</div></div>';
    }).join('');
  }
  var phaseLabel=phase?' — '+phase.charAt(0).toUpperCase()+phase.slice(1):'';
  openModal('Add Exercise'+phaseLabel,'<div class="fg"><input class="finput" id="ex-srch" placeholder="Search all exercises…" oninput="refreshPickerFilter(this.value)" autocomplete="off"></div><div id="ex-pick">'+buildPickerHTML('')+'</div>');
  G._pickerBuilder=buildPickerHTML;
}

function togglePickGroup(id,hdrEl){var body=document.getElementById(id);if(!body)return;var isOpen=body.classList.contains('open');body.classList.toggle('open',!isOpen);var chev=hdrEl.querySelector('.pick-group-chev');if(chev)chev.classList.toggle('open',!isOpen);}
function pickEx(id){
  if(!G.sess)return;
  var exDef=db.exercises.find(function(e){return e.id===id;});
  var isCardio=exDef&&exDef.type==='cardio';
  var phase=G._pickPhase||'workout';
  var hasChoices=exDef&&!isCardio&&((exDef.equipment&&exDef.equipment.length>1)||(exDef.positions&&exDef.positions.length>0));
  if(hasChoices){
    var PRIMARY_EQUIP=['barbell','dumbbell','cable','machine','bodyweight','smith'];
    var eChips=PRIMARY_EQUIP.filter(function(eId){return exDef.equipment.indexOf(eId)>=0;}).map(function(eId){
      var eq=EQUIP_LIST.find(function(x){return x.id===eId;});
      return '<div class="equip-primary-chip" onclick="pickEquipSingle(this,\''+eId+'\')" data-id="'+eId+'">'+(eq?eq.icon+' '+eq.label:eId)+'</div>';
    }).join('');
    var pChips=(exDef.positions||[]).map(function(p){return '<div class="pos-chip" onclick="pickPos(this,\''+p+'\')">'+p+'</div>';}).join('');
    openModal('Configure: '+exDef.name,
      '<div class="fg"><label class="flabel">Equipment</label><div class="equip-primary" id="pick-equip">'+eChips+'<div class="equip-more-btn" onclick="openMoreEquipPicker()">More ›</div></div></div>'+
      (exDef.positions&&exDef.positions.length?'<div class="fg"><label class="flabel">Position / Angle</label><div class="chip-grid" id="pick-pos">'+pChips+'</div></div>':'')+
      '<div style="height:8px"></div><button class="btn btn-primary" onclick="confirmPickEx('+id+')">Add to Workout</button>'
    );
    setTimeout(function(){var chips=document.querySelectorAll('#pick-equip .equip-primary-chip');if(chips.length)chips[0].classList.add('sel');},50);
    return;
  }
  var entry={exerciseId:id,phase:phase,notes:''};
  if(isCardio){entry.cardioData={level:1,durationSecs:0,done:false};entry.minimized=false;}
  else if(exDef&&exDef.type==='stretch'){
    entry.sets=[{holdSecs:30,done:false}];
    entry.maxSets=1;
    entry.minimized=false;
    entry.equipOverride=exDef?[exDef.equipment[0]||'']:[];
  }
  else{
    var prevW=getPrevWeight(id);
    // Progressive reveal: start with 1 set
    entry.sets=[{weight:prevW,reps:'',done:false,warmup:false}];
    entry.maxSets=4; // default max, can add more manually
    entry.equipOverride=exDef?[exDef.equipment[0]||'']:[];
    entry.minimized=false;
  }
  G.sess.exercises.push(entry);
  // Auto-start warmup timer when first warmup exercise added
  if(phase==='warmup') autoStartPhaseTimer('warmup');
  // Auto-stop warmup and auto-start cooldown timer on phase transitions
  if(phase==='workout') autoStopWarmupIfNeeded();
  if(phase==='cooldown') autoStartPhaseTimer('cooldown');
  closeModal();renderSession();
}

/* === COOLDOWN === */
function startCooldown() {
  if(G.cooldownStart) return; // already running
  G.cooldownStart=Date.now();
  var card=document.getElementById('cooldown-card');
  var btn=document.getElementById('cooldown-btn');
  if(card) card.style.display='block';
  if(btn) { btn.textContent='❄ Running…'; btn.disabled=true; }
  G.cooldownTimerID=setInterval(function(){
    var el=document.getElementById('cooldown-time');
    if(el){ var s=Math.floor((Date.now()-G.cooldownStart)/1000); el.textContent=fmt(s); }
  },500);
}
function stopCooldown() {
  clearInterval(G.cooldownTimerID);
  var card=document.getElementById('cooldown-card');
  if(card) card.style.display='none';
  var btn=document.getElementById('cooldown-btn');
  if(btn){ btn.textContent='❄ Cool Down'; btn.disabled=false; }
  G.cooldownStart=0;
}
function endSession() {
  if(!G.sess) return;
  stopAllPhaseTimers(); // save any running phase timers before modal
  var cooldownSecs=G.cooldownStart?Math.floor((Date.now()-G.cooldownStart)/1000):0;

  openModal('Finish Workout',

      '</div>'+
      (cooldownSecs?'<div style="display:flex;justify-content:space-between;margin-bottom:6px">'+
        '<span style="font-size:13px;color:var(--t2)">Cool Down</span>'+
        '<span style="font-size:13px;font-weight:700;color:var(--blue)">'+fmt(cooldownSecs)+'</span>'+
      '</div>':'')+
      '<div style="display:flex;justify-content:space-between">'+
        '<span style="font-size:13px;color:var(--t2)">Exercises</span>'+
        '<span style="font-size:13px;font-weight:700;color:var(--t1)">'+G.sess.exercises.length+'</span>'+
      '</div>'+

    '<button class="btn btn-primary" onclick="confirmFinishSession()">Save &amp; Finish</button>'+
    '<div style="height:8px"></div>'+

function confirmFinishSession() {
  if(!G.sess) return;
  var notesEl=document.getElementById('finish-notes');
  if(notesEl) G.sess.notes=notesEl.value.trim();
  var finalDur=G.sessStart?Math.floor((Date.now()-G.sessStart-G.sessPaused)/1000):G.elapsed;
  G.sess.duration=finalDur;
  // Auto-save phase timers that are still running
  ['warmup','cooldown'].forEach(function(p){
    var pt=G_phaseTimers[p];
    if(pt.running) {
      pt.elapsed=Math.floor((Date.now()-pt.start)/1000);
      pt.running=false;
      clearInterval(pt.id);
      // Store in session notes if no other notes
      if(pt.elapsed>0 && !G.sess[p+'TimerSecs']) G.sess[p+'TimerSecs']=pt.elapsed;
    }
    // Reset for next session
    G_phaseTimers[p]={start:0,running:false,elapsed:0,id:null};
  });
  // Also stop any running cardio timer
  if(G.cardioTimerEi>=0) {
    var secs=Math.floor((Date.now()-G.cardioTimerStart)/1000);
    var cex=G.sess.exercises[G.cardioTimerEi];
    if(cex){if(!cex.cardioData)cex.cardioData={};cex.cardioData.durationSecs=secs;cex.cardioData.duration=Math.round(secs/60*10)/10;}
    clearInterval(G.cardioTimerID);
    G.cardioTimerEi=-1;
  }
  db.sessions.push(JSON.parse(JSON.stringify(G.sess)));
  clearInterval(G.timerID);
  G.sess=null; G.elapsed=0; G.sessStart=0; G.sessPaused=0;
  saveDB(); closeModal();
  _setLogState('planning');
  renderPlanner();
  toast('✓ Workout saved!'); navTo('s-home');
}

/* === REST TIMER (inline, timestamp-based) === */
function startRestTimer(secs, anchorEi) {
  // Use per-exercise restSecs if configured on this exercise
  if(anchorEi !== undefined && anchorEi >= 0 && G.sess && G.sess.exercises[anchorEi]) {
    var exRestSecs = G.sess.exercises[anchorEi].restSecs;
    if(exRestSecs) secs = exRestSecs;
  }
  G.restTotal=secs; G.restRem=secs;
  G.restEnd=Date.now()+(secs*1000);
  G.restAnchorEi = (anchorEi !== undefined) ? anchorEi : -1;
  clearInterval(G.restID);
  var el=document.getElementById('rest-inline');
  if(el) el.classList.add('open');
  updateRestDisplay();
  G.restID=setInterval(function(){
    var rem=Math.max(0,Math.round((G.restEnd-Date.now())/1000));
    G.restRem=rem;
    updateRestDisplay();
    if(rem<=0){
      clearInterval(G.restID);
      playRestBeep();
      var anchor = G.restAnchorEi;
      skipRest();
      // Auto-focus the next undone set input after rest expires
      setTimeout(function(){ _focusNextSetAfterRest(anchor); }, 200);
    }
  },500);
}
function updateRestDisplay() {
  var m=Math.floor(G.restRem/60), s=G.restRem%60;
  var txt=m+':'+pad(s);
  // Update inline bar
  var el=document.getElementById('rest-time-txt');
  if(el) el.textContent=txt;
  var circ=150.8, off=circ*(1-G.restRem/Math.max(G.restTotal,1));
  var pc=document.getElementById('rest-prog-c');
  if(pc) pc.style.strokeDashoffset=off;
  // Update mini badge on ALL exercise cards — including minimized ones
  document.querySelectorAll('.mini-rest').forEach(function(b){ b.classList.remove('active'); });
  if(G.restAnchorEi>=0 && G.restRem>0) {
    // Show on anchor exercise card
    var badge=document.getElementById('mini-rest-'+G.restAnchorEi);
    if(badge){
      badge.classList.add('active');
      var t=badge.querySelector('.mini-rest-time');
      if(t) t.textContent=txt;
    }
    // Also show a compact indicator on all other visible exercise cards
    document.querySelectorAll('.mini-rest').forEach(function(b){
      if(!b.classList.contains('active')){
        var t2=b.querySelector('.mini-rest-time');
        if(t2) t2.textContent=txt;
        b.classList.add('active');
      }
    });
  }
}
function skipRest() {
  clearInterval(G.restID);
  var anchor = G.restAnchorEi;
  G.restEnd=0; G.restAnchorEi=-1;
  var el=document.getElementById('rest-inline');
  if(el) el.classList.remove('open');
  document.querySelectorAll('.mini-rest').forEach(function(b){b.classList.remove('active');});
  // When user manually skips rest, also focus next set
  if(anchor >= 0) setTimeout(function(){ _focusNextSetAfterRest(anchor); }, 100);
}

function _focusNextSetAfterRest(anchorEi) {
  if(!G.sess) return;
  var exs = G.sess.exercises;
  if(anchorEi < 0 || anchorEi >= exs.length) return;
  var ex = exs[anchorEi];

  // SS mode: after anchor exercise's set, go to the TOP exercise of the same SS group next set
  if(ex.ssGroup) {
    // Find all exercises in the same SS group, sorted by their position in session
    var ssMembers = exs.reduce(function(acc, e, i){
      if((e.phase||'workout')===(ex.phase||'workout') && e.ssGroup===ex.ssGroup && e.linkedTo===undefined) acc.push({ex:e, ei:i});
      return acc;
    }, []);
    // For SS: after logging a set from the anchor, we go back to the FIRST member for its next undone set
    // (round-robin: A→B→A→B pattern, so after logging B go back to A)
    var anchorPos = ssMembers.findIndex(function(m){return m.ei===anchorEi;});
    // Try next member in rotation first, then wrap to first
    for(var offset=1; offset<=ssMembers.length; offset++){
      var nextMember = ssMembers[(anchorPos+offset) % ssMembers.length];
      var nextEx = nextMember.ex;
      var nextEi = nextMember.ei;
      var nextUndone = nextEx.sets ? nextEx.sets.findIndex(function(s){return !s.done&&!s.warmup;}) : -1;
      if(nextUndone >= 0){
        var wtEl = document.getElementById('wt-'+nextEi+'-'+nextUndone);
        var rpEl = document.getElementById('reps-'+nextEi+'-'+nextUndone);
        // If weight pre-filled, go straight to reps; otherwise weight
        var target = (wtEl && wtEl.value && wtEl.value.trim()) ? rpEl : wtEl;
        if(target){
          target.scrollIntoView({block:'center',behavior:'smooth'});
          target.focus(); target.select();
          return;
        }
      }
    }
    return;
  }

  // Non-SS: find next undone set in same exercise
  var sets = ex.sets || [];
  for(var i=0; i<sets.length; i++){
    if(!sets[i].done && !sets[i].warmup){
      var wtEl2 = document.getElementById('wt-'+anchorEi+'-'+i);
      var rpEl2 = document.getElementById('reps-'+anchorEi+'-'+i);
      var target2 = (wtEl2 && wtEl2.value && wtEl2.value.trim()) ? rpEl2 : wtEl2;
      if(target2){
        target2.scrollIntoView({block:'center',behavior:'smooth'});
        target2.focus(); target2.select();
        return;
      }
    }
  }
}
function addRestTime(s) {
  G.restEnd+=s*1000;
  G.restRem=Math.max(5,Math.round((G.restEnd-Date.now())/1000));
  G.restEnd=Date.now()+G.restRem*1000; // re-anchor so subtraction doesn't go negative
  G.restTotal=Math.max(G.restTotal,G.restRem);
  updateRestDisplay();
}

function toggleExCat(catKey) {
  G_exCatOpen[catKey] = G_exCatOpen[catKey] === false ? true : false;
  var open = G_exCatOpen[catKey];
  var body = document.getElementById('excatbody-'+catKey);
  if(body) body.style.display = open ? 'block' : 'none';
  var chev = document.getElementById('excatchev-'+catKey);
  if(chev) chev.style.transform = 'rotate('+(open?'90':'0')+'deg)';

function toggleExFilter(muscle) {
  var idx = G_exFilter.indexOf(muscle);
  if(idx>=0) G_exFilter.splice(idx,1);
  else G_exFilter.push(muscle);
  renderExercises();
}

function toggleExCatFilter(catKey) {
  var cat = EX_CATS.find(function(c){ return c.key===catKey; });
  if(!cat) return;
  var allSel = cat.muscles.every(function(m){ return G_exFilter.indexOf(m)>=0; });
  if(allSel) {
    // Deselect all in this category
    cat.muscles.forEach(function(m){ var i=G_exFilter.indexOf(m); if(i>=0) G_exFilter.splice(i,1); });
  } else {
    // Select all in this category
    cat.muscles.forEach(function(m){ if(G_exFilter.indexOf(m)<0) G_exFilter.push(m); });
  }
  renderExercises();
}

function clearExFilter() {

  var logModeHoldEl = document.getElementById('exf-logmode-hold');
  var defaultLogMode = (logModeHoldEl && logModeHoldEl.classList.contains('sel')) ? 'hold' : 'reps';
  // Detect type from muscle selection
  var isStretch = muscles.indexOf('Stretching')>=0;
  var isCardio = muscles.indexOf('Cardio')>=0;
  var exType = isStretch?'stretch':(isCardio?'cardio':undefined);
  if(id){
    var idx=db.exercises.findIndex(function(e){return e.id===id;});
    if(idx>-1){
      var existing=db.exercises[idx];
      var rec={id:id,name:name,muscles:muscles,equipment:equipment,positions:positions,notes:notes,defaultLogMode:defaultLogMode};
      if(exType) rec.type=exType;
      else if(existing.type) rec.type=existing.type;
      db.exercises[idx]=rec;
    }
  } else {
    var newRec={id:db.ids.exercise++,name:name,muscles:muscles,equipment:equipment,positions:positions,notes:notes,defaultLogMode:defaultLogMode};
    if(exType) newRec.type=exType;
    db.exercises.push(newRec);
  }
  saveDB();closeModal();renderExercises();toast(id?'✓ Exercise updated':'✓ Exercise added');
}

function openExDetail(id) {
  var ex=db.exercises.find(function(e){return e.id===id;});
  if(!ex) return;

  var isCardio = ex.type==='cardio';

  // Collect per-session exercise notes for this exercise

    } else if(isCardio && exD && exD.cardioData){

      summary=done.map(function(x){return x.weight+'×'+x.reps;}).join(' | ');
    }
    var noteForSession = exD && exD.notes ? '<div style="font-size:11px;color:var(--purple);margin-top:2px">📝 '+exD.notes+'</div>' : '';
    return '<div class="stat-row" style="background:var(--bg3);border-radius:8px;margin-bottom:4px;border:none;padding:8px 12px;flex-direction:column;align-items:flex-start">'+
      '<div style="display:flex;width:100%;justify-content:space-between"><span class="stat-lbl">'+dd+'</span><span class="stat-val" style="font-size:12px">'+summary+'</span></div>'+
      noteForSession+
    '</div>';
  }).join(''):'<div style="color:var(--t2);font-size:13px;padding:8px 0">No history yet</div>';

  var notesViewBtn = allNotes.length ?
    '<button class="btn btn-ghost" style="width:100%;margin-bottom:8px;font-size:12px" onclick="viewExerciseNotes('+id+')">📝 View All Notes ('+allNotes.length+')</button>' : '';

  openModal(ex.name,

    ex.muscles.map(function(m){return '<span class="pill pill-teal">'+m+'</span>';}).join('')+
    (isStretch?'<span class="pill" style="background:rgba(157,78,221,0.12);color:var(--purple)">🧘 Stretch</span>':'')+
    (isCardio?'<span class="pill" style="background:rgba(0,217,217,0.12);color:var(--teal)">🏃 Cardio</span>':'')+
    ex.equipment.map(function(e){return '<span class="pill pill-purple">'+eqIcon(e)+' '+eqLabel(e)+'</span>';}).join('')+
    (ex.positions&&ex.positions.length?ex.positions.map(function(p){return '<span style="background:rgba(255,215,0,0.1);color:var(--gold);padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700">'+p+'</span>';}).join(''):'')+'</div>'+
    (ex.notes?'<div style="color:var(--t2);font-size:13px;margin-bottom:16px;padding:10px;background:var(--bg3);border-radius:10px">'+ex.notes+'</div>':'')+
    '<div class="flabel" style="margin-bottom:8px">Recent History</div>'+histHTML+
    '<div style="margin-top:16px;display:flex;flex-direction:column;gap:8px">'+

  );
}

/* === HISTORY === */
function renderHistory() {

  var sess=db.sessions.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  if(!sess.length){el.innerHTML='<div class="empty"><div class="empty-icon">📊</div><div class="empty-label">No history yet</div><div class="empty-sub">Completed workouts will appear here</div></div>';return;}
  el.innerHTML='<div style="height:8px"></div>'+sess.map(sessCardHTML).join('');

function viewSession(id) {
  var s=db.sessions.find(function(x){return x.id===id;});
  if(!s) return;
  var ds=new Date(s.date).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});

  // Build ordered exercise list: warmup cardio → warmup strength/stretch → workout (SS-interleaved) → cooldown
  function buildOrderedGroups(exercises) {
    var warmupCardio   = exercises.filter(function(e){ return (e.phase||'workout')==='warmup' && _isCardio(e); });
    var warmupStrength = exercises.filter(function(e){ return (e.phase||'workout')==='warmup' && !_isCardio(e) && e.linkedTo===undefined && !e.isStretch; });
    var warmupStretch  = exercises.filter(function(e){ return (e.phase||'workout')==='warmup' && e.isStretch; });
    var workout        = exercises.filter(function(e){ return (e.phase||'workout')==='workout' && e.linkedTo===undefined && !_isCardio(e); });
    var cooldownAll    = exercises.filter(function(e){ return (e.phase||'workout')==='cooldown' && e.linkedTo===undefined; });

    // For workout phase: group by ssGroup, then interleave sets round-by-round
    var ssGrouped = {};
    var noSS = [];
    workout.forEach(function(ex){
      if(ex.ssGroup){ if(!ssGrouped[ex.ssGroup]) ssGrouped[ex.ssGroup]=[]; ssGrouped[ex.ssGroup].push(ex); }
      else noSS.push(ex);
    });

    var orderedWorkout = [];
    // Non-SS exercises stay in position
    noSS.forEach(function(ex){ orderedWorkout.push({type:'exercise', ex:ex}); });
    // SS groups: emit as group blocks
    Object.keys(ssGrouped).sort().forEach(function(g){
      orderedWorkout.push({type:'ssGroup', group:g, exercises:ssGrouped[g]});
    });
    // Sort back to original session order approximation
    orderedWorkout.sort(function(a,b){
      var aIdx = a.type==='exercise' ? exercises.indexOf(a.ex) : exercises.indexOf(a.exercises[0]);
      var bIdx = b.type==='exercise' ? exercises.indexOf(b.ex) : exercises.indexOf(b.exercises[0]);
      return aIdx-bIdx;
    });

    return {warmupCardio:warmupCardio, warmupStrength:warmupStrength, warmupStretch:warmupStretch,
            orderedWorkout:orderedWorkout, cooldownAll:cooldownAll, exercises:exercises};
  }
  function _isCardio(ex){
    var exDef=db.exercises.find(function(x){return x.id===ex.exerciseId;});
    return exDef && exDef.type==='cardio';
  }
  function _exName(ex){
    var exDef=db.exercises.find(function(x){return x.id===ex.exerciseId;});
    var name=exDef?exDef.name:'Unknown Exercise';
    if(ex.positionOverride) name+=(' — '+ex.positionOverride);
    if(ex.equipOverride&&ex.equipOverride.length) name+=' ('+ex.equipOverride.map(eqLabel).join('/')+')';
    return name;
  }
  function _cardioCard(ex){
    var cd=ex.cardioData||{};
    var parts=[];
    if(cd.durationSecs) parts.push('<span class="cardio-pill">'+fmt(cd.durationSecs)+'</span>');
    else if(cd.duration) parts.push('<span class="cardio-pill">'+cd.duration+' min</span>');
    if(cd.level) parts.push('<span class="cardio-pill">Lvl '+cd.level+'</span>');
    if(cd.calories) parts.push('<span class="cardio-pill">'+cd.calories+' cal</span>');
    if(cd.speed) parts.push('<span class="cardio-pill">'+cd.speed+' mph</span>');
    if(cd.distance) parts.push('<span class="cardio-pill">'+cd.distance+'</span>');
    return '<div style="background:rgba(0,217,217,0.05);border:1px solid rgba(0,217,217,0.15);border-radius:10px;padding:12px;margin-bottom:8px">'+
      '<div style="font-size:14px;font-weight:700;color:var(--teal);margin-bottom:6px">🏃 '+_exName(ex)+'</div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:6px">'+(parts.join('')||'<span style="font-size:12px;color:var(--t3)">No data recorded</span>')+'</div>'+
    '</div>';
  }
  function _strengthCard(ex, label, color){
    color = color||'var(--t1)';
    var exDef2=db.exercises.find(function(x){return x.id===ex.exerciseId;});
    var isStretch2 = exDef2 && exDef2.type==='stretch';
    if(isStretch2) {
      var doneSets=ex.sets?ex.sets.filter(function(x){return x.done;}):[]; 
      return '<div style="background:rgba(157,78,221,0.06);border:1px solid rgba(157,78,221,0.15);border-radius:10px;padding:12px;margin-bottom:8px">'+
        '<div style="font-size:13px;font-weight:700;margin-bottom:6px;color:var(--purple)">🧘 '+_exName(ex)+'</div>'+
        (doneSets.length?
          '<div style="font-size:12px;color:var(--t2)">'+doneSets.map(function(s,i){return 'Set '+(i+1)+': <span style="color:var(--purple);font-weight:600">'+fmt(s.holdSecs||30)+'</span>';}).join(' · ')+'</div>'
          :'<div style="font-size:12px;color:var(--t3)">No completed sets</div>')+
        (ex.notes?'<div style="font-size:11px;color:var(--purple);margin-top:5px;font-style:italic">📝 '+ex.notes+'</div>':'')+
      '</div>';
    }
    var done=ex.sets?ex.sets.filter(function(x){return x.done&&x.weight&&x.reps&&!x.placeholder;}):[]; 
    var wu=ex.sets?ex.sets.filter(function(x){return x.warmup&&x.done;}):[]; 
    // Find linked AB sets
    var abEntry=s.exercises.find(function(e){return e.linkedTo===s.exercises.indexOf(ex);});
    var abSets=abEntry?abEntry.sets.filter(function(x){return x.done&&!x.placeholder;}):[]; 
    var abExDef=abEntry?db.exercises.find(function(x){return x.id===abEntry.exerciseId;}):null;
    return '<div style="background:var(--bg3);border-radius:10px;padding:12px;margin-bottom:8px">'+
      '<div style="font-size:13px;font-weight:700;margin-bottom:6px;color:'+color+'">'+_exName(ex)+(label?'<span style="font-size:10px;font-weight:800;color:'+color+';background:rgba(157,78,221,0.15);border-radius:5px;padding:1px 6px;margin-left:6px">'+label+'</span>':'')+'</div>'+
      (wu.length?'<div style="font-size:11px;color:var(--gold);margin-bottom:4px">WU: '+wu.map(function(x){return x.weight+'×'+x.reps;}).join(', ')+'</div>':'')+
      (done.length
        ? done.map(function(set,i){
            var abSet=abSets[i];
            return '<div style="font-size:12px;color:var(--t2);padding:2px 0">'+
              'Set '+(i+1)+': <span style="color:var(--t1);font-weight:600">'+set.weight+'lbs × '+set.reps+' reps</span>'+
              (abSet?'  <span style="color:var(--green);font-size:11px">· AB '+(abExDef?abExDef.name:'')+(abSet.weight?' '+abSet.weight+'lbs':'')+' × '+abSet.reps+'</span>':'')+
            '</div>';
          }).join('')
        : '<div style="font-size:12px;color:var(--t3)">No completed sets</div>')+
      (ex.notes?'<div style="font-size:11px;color:var(--purple);margin-top:5px;font-style:italic">📝 '+ex.notes+'</div>':'')+
    '</div>';
  }
  function _ssGroupCard(group, exercises){
    var ssColors={'A':'var(--purple)','B':'var(--teal)','C':'var(--gold)','D':'rgba(93,168,255,1)'};
    var ssBorders={'A':'rgba(157,78,221,0.25)','B':'rgba(0,217,217,0.25)','C':'rgba(255,215,0,0.25)','D':'rgba(93,168,255,0.25)'};
    var color=ssColors[group]||'var(--purple)';
    var borderColor=ssBorders[group]||'rgba(157,78,221,0.25)';
    return '<div style="background:var(--bg3);border:1px solid '+borderColor+';border-radius:10px;padding:12px;margin-bottom:8px">'+
      '<div style="font-size:11px;font-weight:800;color:'+color+';letter-spacing:0.8px;margin-bottom:8px">SUPERSET '+group+'</div>'+
      exercises.map(function(ex){return _strengthCard(ex,'',color);}).join('')+
    '</div>';
  }

  var grp = buildOrderedGroups(s.exercises);
  var html = '';

  if(grp.warmupCardio.length){
    html += '<div style="font-size:10px;font-weight:800;color:var(--t3);letter-spacing:1.2px;margin:0 0 6px;text-transform:uppercase">Cardio Warm-Up</div>';
    html += grp.warmupCardio.map(_cardioCard).join('');
  }
  if(grp.warmupStrength.length||grp.warmupStretch.length){
    html += '<div style="font-size:10px;font-weight:800;color:var(--t3);letter-spacing:1.2px;margin:8px 0 6px;text-transform:uppercase">Warm-Up</div>';
    html += grp.warmupStrength.map(function(ex){return _strengthCard(ex,'');}).join('');
    html += grp.warmupStretch.map(function(ex){
      var elapsed=ex.sets&&ex.sets[0]?ex.sets[0].reps:'';
      return '<div style="background:rgba(0,150,255,0.06);border:1px solid rgba(0,150,255,0.15);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:12px;color:var(--t2)">'+
        '🧘 Stretching'+(elapsed?' — '+elapsed:'')+'</div>';
    }).join('');
  }
  if(grp.orderedWorkout.length){
    html += '<div style="font-size:10px;font-weight:800;color:var(--teal);letter-spacing:1.2px;margin:8px 0 6px;text-transform:uppercase">Workout</div>';
    grp.orderedWorkout.forEach(function(item){
      if(item.type==='exercise') html += _strengthCard(item.ex,'');
      else if(item.type==='ssGroup') html += _ssGroupCard(item.group, item.exercises);
    });
  }
  if(grp.cooldownAll.length){
    html += '<div style="font-size:10px;font-weight:800;color:var(--purple);letter-spacing:1.2px;margin:8px 0 6px;text-transform:uppercase">Cool-Down</div>';
    grp.cooldownAll.forEach(function(ex){
      var exDef=db.exercises.find(function(x){return x.id===ex.exerciseId;});
      if(exDef&&exDef.type==='cardio') html+=_cardioCard(ex);
      else if(ex.isStretch){
        var elapsed=ex.sets&&ex.sets[0]?ex.sets[0].reps:'';
        html+='<div style="background:rgba(157,78,221,0.06);border:1px solid rgba(157,78,221,0.15);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:12px;color:var(--t2)">🧘 Stretching'+(elapsed?' — '+elapsed:'')+'</div>';
      } else html+=_strengthCard(ex,'');
    });
  }

  var totalSets=s.exercises.reduce(function(a,e){return a+(e.sets?e.sets.filter(function(x){return x.done&&!x.warmup&&!x.placeholder;}).length:0);},0);
  openModal(ds,
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">'+
      s.muscles.map(function(m){return '<span class="pill pill-teal">'+m+'</span>';}).join('')+
    '</div>'+
    '<div style="display:flex;gap:16px;margin-bottom:14px">'+
      '<div style="font-size:12px;color:var(--t2)">Duration <span style="color:var(--teal);font-weight:700">'+fmt(s.duration)+'</span></div>'+
      '<div style="font-size:12px;color:var(--t2)">Sets <span style="color:var(--t1);font-weight:700">'+totalSets+'</span></div>'+
      '<div style="font-size:12px;color:var(--t2)">Exercises <span style="color:var(--t1);font-weight:700">'+s.exercises.filter(function(e){return e.linkedTo===undefined&&!e.isStretch;}).length+'</span></div>'+
    '</div>'+
    html+
    '<div style="margin-top:8px"><button class="btn btn-danger" style="width:100%" onclick="deleteSession('+s.id+')">Delete Session</button></div>'
  );
}

function calPrev(){G.calMonth--;if(G.calMonth<0){G.calMonth=11;G.calYear--;}renderCalendar();}
function calNext(){G.calMonth++;if(G.calMonth>11){G.calMonth=0;G.calYear++;}renderCalendar();}
function calClick(yr,mo,d){
  var k=yr+'-'+mo+'-'+d;
  var sess=db.sessions.filter(function(s){var dd=new Date(s.date);return dd.getFullYear()+'-'+dd.getMonth()+'-'+dd.getDate()===k;});

  if(!el) return;
  if(!sess.length){el.innerHTML='';return;}

  el.innerHTML='<div class="sec-hdr" style="padding:0;margin-bottom:8px">'+ds+'</div>'+sess.map(sessCardHTML).join('');
}

/* === REORDER === */
function moveEx(ei, dir) {
  if(!G.sess) return;
  var exs=G.sess.exercises;
  var phase=(exs[ei].phase||'workout');
  // Build candidate list — only non-linked exercises in the same phase
  var candidates=[];
  for(var i=0;i<exs.length;i++){
    if((exs[i].phase||'workout')===phase && exs[i].linkedTo===undefined && !exs[i].isStretch) candidates.push(i);
  }
  var pos=candidates.indexOf(ei);
  var newPos=pos+dir;
  if(newPos<0||newPos>=candidates.length) return;
  var newEi=candidates[newPos];
  var tmp=exs[ei]; exs[ei]=exs[newEi]; exs[newEi]=tmp;
  // Also move any linked AB entries alongside their parent
  renderSession();
}

/* === PHASE TIMERS (warmup/cooldown general stretch) === */
var G_phaseTimers = {
  warmup:   {start:0, running:false, elapsed:0, id:null},
  cooldown: {start:0, running:false, elapsed:0, id:null}
};

function togglePhaseTimer(phase) {
  var pt=G_phaseTimers[phase];
  var valEl=document.getElementById('ptv-'+phase);
  var btnEl=document.getElementById('ptb-'+phase);
  var stopEl=document.getElementById('pts-'+phase);
  if(!pt.running) {
    pt.start=Date.now()-pt.elapsed*1000;
    pt.running=true;
    if(btnEl){btnEl.textContent='⏸ Pause';btnEl.classList.add('active');}
    if(stopEl) stopEl.style.display='inline-flex';
    pt.id=setInterval(function(){
      pt.elapsed=Math.floor((Date.now()-pt.start)/1000);
      if(valEl) valEl.textContent=fmt(pt.elapsed);
    },500);
  } else {
    pt.running=false;
    clearInterval(pt.id);
    if(btnEl){btnEl.textContent='▶ Resume';btnEl.classList.remove('active');}
  }
}

function stopPhaseTimer(phase) {
  var pt=G_phaseTimers[phase];
  clearInterval(pt.id);
  pt.running=false;
  var elapsed=pt.elapsed;
  if(!elapsed) { pt.elapsed=0; return; }
  // Auto-add a stretching entry to the phase to record the time
  if(G.sess) {
    var stretchName=phase==='warmup'?'Stretching / Warm-Up':'Stretching / Cool-Down';
    var existing=G.sess.exercises.find(function(e){
      var exDef=db.exercises.find(function(x){return x.id===e.exerciseId;});
      return (exDef&&exDef.name===stretchName)||e.isStretch===true&&(e.phase||'workout')===phase;
    });
    if(!existing) {
      var strEx=db.exercises.find(function(e){return e.name===stretchName;});
      if(!strEx){
        strEx={id:db.ids.exercise++,name:stretchName,muscles:['Full Body'],equipment:['bodyweight'],positions:[],notes:'Auto-generated from phase timer',type:'stretch'};
        db.exercises.push(strEx);
        saveDB();
      }
      G.sess.exercises.push({
        exerciseId:strEx.id,
        phase:phase,
        sets:[{weight:'',reps:fmt(elapsed),done:true,warmup:false}],
        equipOverride:['bodyweight'],
        minimized:true,
        completed:true,
        isStretch:true
      });
    }
  }
  var finalElapsed = pt.elapsed;
  pt.elapsed=0;
  var valEl=document.getElementById('ptv-'+phase);
  var btnEl=document.getElementById('ptb-'+phase);
  var stopEl=document.getElementById('pts-'+phase);
  // Show the recorded time rather than resetting to 0:00
  if(valEl) valEl.textContent=fmt(finalElapsed)+' saved';
  if(btnEl){btnEl.textContent='▶ Restart';btnEl.classList.remove('active');}
  if(stopEl) stopEl.style.display='none';
  renderSession();
  toast('✓ '+fmt(finalElapsed)+' '+(phase==='warmup'?'warm-up':'cool-down')+' saved');
}

function stopAllPhaseTimers() {
  ['warmup','cooldown'].forEach(function(p){
    var pt=G_phaseTimers[p];
    if(pt.running||pt.elapsed>0) stopPhaseTimer(p);
  });
}

// Manual override: type a number of minutes directly into the timer field
function setPhaseTimerManual(phase, val) {

  var secs = Math.round(mins * 60);
  var pt = G_phaseTimers[phase];

  pt.elapsed = secs;
  var valEl = document.getElementById('ptv-'+phase);
  var btnEl = document.getElementById('ptb-'+phase);
  var stopEl = document.getElementById('pts-'+phase);
  if(valEl) valEl.textContent = fmt(secs);

  if(stopEl) stopEl.style.display='inline-flex';

  var inp = document.getElementById('ptm-'+phase);
  if(inp) inp.value='';

/* === REST BEEP — robust multi-method (pre-warm, square wave, haptic, visual, HTML5 fallback) === */
var _audioCtx = null;
function getAudioCtx() {
  if(!_audioCtx || _audioCtx.state==='closed') _audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(_audioCtx.state==='suspended') _audioCtx.resume();
  return _audioCtx;
}
// Pre-warm on BOTH touchstart and click so iOS allows audio on first rest timer
document.addEventListener('touchstart', function(){ try{ getAudioCtx(); }catch(e){} }, {once:true, passive:true});
document.addEventListener('click',      function(){ try{ getAudioCtx(); }catch(e){} }, {once:true, passive:true});

function playRestBeep() {
  // 1. Haptic (works even on mute)
  if(navigator.vibrate) navigator.vibrate([150,80,150,80,300]);

  // 2. Visual flash on rest bar
  var bar = document.getElementById('rest-inline');
  if(bar){
    bar.style.transition='background 0.1s';
    bar.style.background='rgba(0,217,217,0.35)';
    setTimeout(function(){ bar.style.background=''; bar.style.transition=''; },400);
  }

  // 3. Web Audio — square wave tones cut through music better than sine
  try {
    var ctx = getAudioCtx();
    var now = ctx.currentTime;
    [[0,880],[0.3,1100],[0.6,1320]].forEach(function(pair){
      var when=pair[0], freq=pair[1];
      var osc=ctx.createOscillator();
      var gain=ctx.createGain();
      osc.type='square';
      osc.frequency.value=freq;
      osc.connect(gain); gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.35, now+when);
      gain.gain.exponentialRampToValueAtTime(0.001, now+when+0.22);
      osc.start(now+when);
      osc.stop(now+when+0.25);
    });
  } catch(e) {
    // 4. HTML5 Audio fallback — tiny WAV data URI
    try {
      var wav='UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
      var a=new Audio('data:audio/wav;base64,'+wav);
      a.volume=1; a.play();
    } catch(e2){}
  }
}

function openPresetSwapPicker(presetId, exIdx) {
  // Show exercise picker to replace a specific slot
  var p = db.presets.find(function(x){return x.id===presetId;});
  if(!p) return;
  var curExId = p.exercises[exIdx] ? p.exercises[exIdx].exerciseId : null;
  var curEx = curExId ? db.exercises.find(function(e){return e.id===curExId;}) : null;
  var grouped={};
  db.exercises.filter(function(e){return !e.type;}).forEach(function(ex){
    var k=ex.muscles[0]||'Other';
    if(!grouped[k])grouped[k]=[];
    grouped[k].push(ex);
  });
  // Sort so current muscle group comes first
  var curMuscle = curEx ? curEx.muscles[0] : null;
  var keys = Object.keys(grouped).sort(function(a,b){
    if(a===curMuscle) return -1; if(b===curMuscle) return 1; return a.localeCompare(b);
  });
  var rows = keys.map(function(m){
    var gid = 'sg-'+m.replace(/\W/g,'');
    var isOpen = m===curMuscle;
    var exRows = grouped[m].map(function(ex){
      var isCur = ex.id===curExId;
      return '<div class="card-row" onclick="doSwapPresetEx('+presetId+','+exIdx+','+ex.id+')" '+
        'style="border-radius:8px;margin-bottom:3px;background:var(--bg3);border:1px solid '+(isCur?'rgba(0,217,217,0.35)':'var(--border1)')+'">'+
        '<div class="card-body">'+
          '<div class="card-title" style="font-size:13px;color:'+(isCur?'var(--teal)':'var(--t1)')+'">'+ex.name+(isCur?' ✓':'' )+'</div>'+
          '<div class="card-sub">'+ex.equipment.map(eqLabel).join(', ')+'</div>'+
        '</div>'+
      '</div>';
    }).join('');
    return '<div style="margin-bottom:8px">'+
      '<div onclick="var b=document.getElementById(\''+gid+'\');b.style.display=b.style.display===\'none\'?\'block\':\'none\'" '+
        'style="font-size:11px;font-weight:700;color:var(--t3);letter-spacing:1px;text-transform:uppercase;padding:6px 0;cursor:pointer;display:flex;align-items:center;justify-content:space-between">'+
        m+'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>'+
      '</div>'+
      '<div id="'+gid+'" style="display:'+(isOpen?'block':'none')+'">'+exRows+'</div>'+
    '</div>';
  }).join('');
  openModal('Swap: '+(curEx?curEx.name:'Exercise'),
    '<div style="margin-bottom:10px;font-size:12px;color:var(--t2)">Select a replacement exercise. The slot will update instantly.</div>'+

  );

  closeModal();
  toast('✓ Exercise swapped');
  viewPreset(presetId);

    builtin: false,
    name: name,
    muscles: p.muscles.slice(),
    exercises: p.exercises.map(function(e){return {exerciseId:e.exerciseId};})
  };
  db.presets.push(newPreset);
  saveDB();
  closeModal();
  renderPresets();
  toast('✓ Saved as "'+name+'"');
  viewPreset(newPreset.id);
}

function loadPreset(id) {
  var p=db.presets.find(function(x){return x.id===id;});
  if(!p) return;
  closeModal();
  // Open new session modal pre-populated with preset muscles
  var day=new Date().getDay();
  var sess={id:db.ids.session++,date:new Date().toISOString(),day:day,muscles:p.muscles,exercises:[],duration:0,notes:''};
  p.exercises.forEach(function(pe){
    var exDef=db.exercises.find(function(e){return e.id===pe.exerciseId;});
    if(!exDef) return;
    var prevW=getPrevWeight(pe.exerciseId);
    // Progressive reveal: start with 1 set, max 4
    sess.exercises.push({exerciseId:pe.exerciseId,phase:'workout',equipOverride:[exDef.equipment[0]||''],
      sets:[{weight:prevW,reps:'',done:false,warmup:false}],maxSets:4,minimized:false,notes:''});
  });
  G.sess=sess;
  G.sessStart=Date.now();
  G.sessPaused=0;
  G.phaseOpen={warmup:true,workout:true,cooldown:true};
  clearInterval(G.timerID);
  G.timerID=setInterval(tickSessionTimer,500);
  saveDB();
  navTo('s-log');
  toast('✓ Preset loaded!');
}

function saveCurrentAsPreset() {
  if(!G.sess) return;
  var exIds=G.sess.exercises.filter(function(e){return !db.exercises.find(function(x){return x.id===e.exerciseId&&x.type==='cardio';});}).map(function(e){return e.exerciseId;});
  openAddPresetModal('',exIds);
}

function deletePreset(id) {
  db.presets=db.presets.filter(function(p){return p.id!==id;});
  saveDB();closeModal();renderPresets();toast('Preset deleted');
}

/* === BACKUP & RESTORE === */
function openBackupModal() {
  var sessCount = db.sessions.length;
  var exCount   = db.exercises.filter(function(e){return !e.type||e.type!=='cardio';}).length;
  var now = new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  openModal('Backup & Restore',
    '<div style="background:var(--bg3);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:13px">'+
      '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="color:var(--t2)">Sessions</span><span style="color:var(--t1);font-weight:700">'+sessCount+'</span></div>'+
      '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="color:var(--t2)">Exercises</span><span style="color:var(--t1);font-weight:700">'+exCount+'</span></div>'+
      '<div style="display:flex;justify-content:space-between"><span style="color:var(--t2)">Presets</span><span style="color:var(--t1);font-weight:700">'+(db.presets||[]).length+'</span></div>'+
    '</div>'+
    '<button class="btn btn-primary" style="margin-bottom:10px" onclick="exportBackup()">'+
      '⬇ Export Backup (.json)'+
    '</button>'+
    '<button class="btn btn-ghost" style="width:100%;margin-bottom:10px" onclick="document.getElementById(\'import-file-input\').click()">'+
      '⬆ Import Backup File'+
    '</button>'+
    '<div style="font-size:11px;color:var(--t3);line-height:1.5;margin-top:4px">'+
      'Export saves all sessions, exercises, and presets to a .json file.<br>'+
      'Import merges or replaces — you will be asked which sessions to keep.<br>'+
      'Schema migrations are applied automatically.'+
    '</div>'
  );
}

function exportBackup() {
  var payload = {
    _workoutdb: true,
    _version: 2,
    _exported: new Date().toISOString(),
    _appVersion: 'WorkoutDB v2',
    data: {
      exercises: db.exercises,
      sessions:  db.sessions,
      presets:   db.presets,
      settings:  db.settings,
      ids:       db.ids
    }
  };
  var json = JSON.stringify(payload, null, 2);
  var blob = new Blob([json], {type:'application/json'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  var dt   = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'WorkoutDB_backup_'+dt+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('✓ Backup exported');
}

function handleImportFile(input) {
  var file = input.files[0];
  if(!file) return;
  input.value = ''; // reset so same file can be re-imported
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var raw = JSON.parse(e.target.result);
      // Support two formats: wrapped (_workoutdb:true) or raw db object
      var imported = raw._workoutdb ? raw.data : raw;
      if(!imported || !Array.isArray(imported.exercises)) {
        toast('❌ Invalid backup file'); return;
      }
      // Schema migration on imported data
      imported = _migrateImport(imported);

      // Ask user: merge (keep existing sessions + add new) or replace
      closeModal();
      openModal('Import Options',
        '<div style="font-size:13px;color:var(--t2);margin-bottom:16px">'+
          'Found <strong style="color:var(--t1)">'+(imported.sessions||[]).length+' sessions</strong> and '+
          '<strong style="color:var(--t1)">'+(imported.exercises||[]).length+' exercises</strong> in the backup.'+
        '</div>'+
        '<button class="btn btn-primary" style="margin-bottom:10px" onclick="confirmImport(\'merge\')">'+
          'Merge — keep my data, add new sessions'+
        '</button>'+
        '<button class="btn btn-ghost" style="width:100%;margin-bottom:10px;color:var(--red);border-color:rgba(232,93,76,0.3)" onclick="confirmImport(\'replace\')">'+
          'Replace — overwrite everything with backup'+
        '</button>'+
        '<button class="btn btn-ghost" style="width:100%" onclick="closeModal()">Cancel</button>'
      );
      // Store parsed import temporarily
      G._pendingImport = imported;
    } catch(err) {
      toast('❌ Could not read file: '+err.message);
    }
  };
  reader.readAsText(file);
}

function _migrateImport(imported) {
  // Ensure all required fields exist
  if(!Array.isArray(imported.exercises)) imported.exercises = [];
  if(!Array.isArray(imported.sessions))  imported.sessions  = [];
  if(!Array.isArray(imported.presets))   imported.presets   = [];
  if(!imported.settings) imported.settings = {defaultRestSecs:90, weightUnit:'lbs'};
  if(!imported.ids) imported.ids = {exercise:250, session:1, preset:12};

  // Migrate sessions: ensure all exercise entries have required fields
  imported.sessions.forEach(function(s) {
    if(!s.id) s.id = Date.now();
    if(!s.date) s.date = new Date().toISOString();
    if(!Array.isArray(s.exercises)) s.exercises = [];
    if(!Array.isArray(s.muscles)) s.muscles = [];
    s.exercises.forEach(function(ex) {
      if(!ex) return;
      if(!ex.phase) ex.phase = 'workout';
      if(ex.notes === undefined) ex.notes = '';
      if(ex.maxSets === undefined && ex.sets) ex.maxSets = ex.sets.filter(function(s){return !s.warmup;}).length || 4;
      if(Array.isArray(ex.sets)) {
        ex.sets = ex.sets.filter(function(x){ return x && typeof x === 'object'; });
        ex.sets.forEach(function(set){
          if(set.holdSecs === undefined && !set.weight && !set.reps) set.holdSecs = 30;
        });
      } else if(!ex.cardioData) {
        ex.sets = [];
      }
    });
  });

  // Migrate exercises: add positions field if missing
  imported.exercises.forEach(function(ex) {
    if(!ex) return;
    if(!ex.positions) ex.positions = [];
    if(!ex.muscles) ex.muscles = [];
    if(!ex.equipment) ex.equipment = [];
  });

  // Inject ALL built-in exercises missing from the imported data
  // This is the critical step — old exports won't have stretch/cardio/new exercises
  var fresh = freshDB();
  fresh.exercises.forEach(function(e){
    if(!imported.exercises.find(function(x){return x.id===e.id;})){
      imported.exercises.push(e);
    }
  });
  imported.ids.exercise = Math.max(imported.ids.exercise||1, 250);

  // Inject ALL built-in presets missing from the imported data
  fresh.presets.forEach(function(p){
    if(!imported.presets.find(function(x){return x.id===p.id;})){
      imported.presets.push(p);
    }
  });
  imported.ids.preset = Math.max(imported.ids.preset||1, 12);

  return imported;
}

function confirmImport(mode) {
  var imported = G._pendingImport;
  G._pendingImport = null;
  if(!imported) { closeModal(); return; }

  if(mode === 'replace') {
    db.exercises = imported.exercises;
    db.sessions  = imported.sessions;
    db.presets   = imported.presets;
    db.settings  = imported.settings;
    db.ids       = imported.ids;
  } else {
    // Merge: inject exercises missing from current db by ID
    var existingExIds = db.exercises.map(function(e){ return e.id; });
    imported.exercises.forEach(function(e){
      if(existingExIds.indexOf(e.id)<0) db.exercises.push(e);
    });
    // Merge sessions: add any with IDs not already present
    var existingSessIds = db.sessions.map(function(s){ return s.id; });
    imported.sessions.forEach(function(s){
      if(existingSessIds.indexOf(s.id)<0) db.sessions.push(s);
    });
    // Merge presets
    var existingPresetIds = db.presets.map(function(p){ return p.id; });
    (imported.presets||[]).forEach(function(p){
      if(existingPresetIds.indexOf(p.id)<0) db.presets.push(p);
    });
    // Bump IDs to avoid collisions — never go below 250 for exercises
    db.ids.exercise = Math.max(db.ids.exercise, imported.ids.exercise||250, 250);
    db.ids.session  = Math.max(db.ids.session,  imported.ids.session||1);
    db.ids.preset   = Math.max(db.ids.preset,   imported.ids.preset||12, 12);
  }

  // After either mode, ensure all built-in exercises/presets are present
  // (safety net in case _migrateImport didn't cover a path)
  var fresh2 = freshDB();
  fresh2.exercises.forEach(function(e){
    if(!db.exercises.find(function(x){return x.id===e.id;})) db.exercises.push(e);
  });
  fresh2.presets.filter(function(p){return p.builtin;}).forEach(function(p){
    if(!db.presets.find(function(x){return x.id===p.id;})) db.presets.push(p);
  });
  db.ids.exercise = Math.max(db.ids.exercise||1, 250);
  db.ids.preset   = Math.max(db.ids.preset||1, 12);
  db.schemaVersion = 3;

  saveDB();
  closeModal();
  renderHome();
  toast('✓ Import complete — '+(mode==='replace'?'data replaced':'data merged'));
}

/* === INIT === */
renderHome();
</script>
