<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="screen-orientation" content="portrait">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WorkoutDB">
<title>WorkoutDB v1</title>
<style>
:root {
  --bg0:#0E0F11;--bg1:#141517;--bg2:#1A1B1E;--bg3:#202124;--bg4:#27292D;
  --teal:#00D9D9;--purple:#9D4EDD;--red:#E85D4C;--gold:#FFD700;--green:#3DDC84;
  --t1:#ECF0FA;--t2:#7B88A8;--t3:#42495E;
  --border1:rgba(255,255,255,0.055);--border2:rgba(255,255,255,0.10);
  --safe-t:env(safe-area-inset-top,44px);--safe-b:env(safe-area-inset-bottom,20px);
  --trans:0.22s cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden}
body{height:100%;background:var(--bg0);color:var(--t1);font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;position:relative;overflow:hidden}
/* HEADER */
#hdr{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 6px) 16px 10px;background:linear-gradient(180deg,rgba(0,100,180,0.10) 0%,var(--bg1) 100%);border-bottom:1px solid rgba(255,255,255,0.05);z-index:20;min-height:calc(var(--safe-t) + 50px)}
#hdr-back{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--teal);cursor:pointer;flex-shrink:0}
#hdr-title{flex:1;font-size:17px;font-weight:700;color:var(--t1);letter-spacing:-0.3px}
#hdr-action{width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
/* CONTENT */
#content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
#content::-webkit-scrollbar{display:none}
.screen{display:none;padding:0 0 calc(var(--safe-b) + 80px);min-height:100%}
.screen.active{display:block}
/* NAV */
#nav{flex-shrink:0;display:flex;align-items:center;padding:8px 0 calc(var(--safe-b) + 4px);background:var(--bg1);border-top:1px solid var(--border1);z-index:20}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;cursor:pointer;color:var(--t3);font-size:10px;font-weight:600;letter-spacing:0.3px;transition:color var(--trans)}
.nav-btn svg{width:22px;height:22px}
.nav-btn.active{color:var(--teal)}
.nav-btn.active svg{filter:drop-shadow(0 0 6px rgba(0,217,217,0.6))}
/* SECTION HEADER */
.sec-hdr{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:1.2px;text-transform:uppercase;margin:20px 0 8px;padding:0 16px}
.sec-hdr:first-child{margin-top:8px}
/* CARD */
.card{background:var(--bg2);border:1px solid var(--border1);border-radius:14px;margin:0 16px 10px;overflow:hidden}
.card-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border1);cursor:pointer;transition:background var(--trans)}
.card-row:last-child{border-bottom:none}
.card-row:active{background:rgba(255,255,255,0.04)}
.card-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.card-body{flex:1;min-width:0}
.card-title{font-size:14px;font-weight:600;color:var(--t1)}
.card-sub{font-size:12px;color:var(--t2);margin-top:2px}
.card-right{color:var(--t3);display:flex;align-items:center}
/* STAT ROW */
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border1);font-size:13px}
.stat-row:last-child{border-bottom:none}
.stat-lbl{color:var(--t2)}
.stat-val{color:var(--t1);font-weight:600}
/* BTNS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;font-weight:700;cursor:pointer;transition:all var(--trans);font-family:inherit}
.btn-primary{background:linear-gradient(135deg,var(--teal),var(--purple));color:#000;padding:14px 24px;font-size:15px;width:100%;border-radius:14px}
.btn-primary:active{transform:scale(0.97)}
.btn-ghost{background:var(--bg3);color:var(--t1);border:1px solid var(--border2);padding:10px 18px;font-size:13px}
.btn-ghost:active{background:var(--bg4)}
.btn-danger{background:rgba(232,93,76,0.15);color:var(--red);border:1px solid rgba(232,93,76,0.3);padding:10px 18px;font-size:13px}
.btn-sm{padding:7px 14px;font-size:12px;border-radius:10px}
.btn-icon{width:36px;height:36px;border-radius:10px;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background var(--trans)}
.btn-icon:active{background:var(--bg4)}
/* FAB */
#fab{position:absolute;bottom:calc(var(--safe-b) + 72px);right:20px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--purple));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,217,217,0.35);cursor:pointer;z-index:30;transition:transform var(--trans)}
#fab:active{transform:scale(0.93)}
#fab svg{width:24px;height:24px;color:#000}
/* PILL */
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.pill-teal{background:rgba(0,217,217,0.15);color:var(--teal)}
.pill-purple{background:rgba(157,78,221,0.15);color:var(--purple)}
/* EMPTY */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 32px;gap:12px;text-align:center}
.empty-icon{font-size:52px;margin-bottom:4px}
.empty-label{font-size:18px;font-weight:700;color:var(--t1)}
.empty-sub{font-size:13px;color:var(--t2);line-height:1.5}
/* TOAST */
#toast{position:absolute;bottom:calc(var(--safe-b) + 78px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg4);color:var(--t1);border:1px solid var(--border2);padding:10px 20px;border-radius:30px;font-size:13px;font-weight:600;white-space:nowrap;z-index:999;opacity:0;transition:opacity 0.25s,transform 0.25s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* MODAL */
#modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);z-index:100;display:none;align-items:flex-end;justify-content:center}
#modal-overlay.open{display:flex}
#modal-sheet{background:var(--bg2);border-radius:20px 20px 0 0;border:1px solid var(--border1);border-bottom:none;width:100%;max-width:430px;max-height:88vh;display:flex;flex-direction:column;padding-bottom:calc(var(--safe-b) + 8px)}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--bg4);margin:12px auto 8px;flex-shrink:0}
.modal-hdr{display:flex;align-items:center;padding:0 16px 12px;border-bottom:1px solid var(--border1);flex-shrink:0}
.modal-title-txt{flex:1;font-size:17px;font-weight:700}
#modal-body{overflow-y:auto;flex:1;padding:16px}
#modal-body::-webkit-scrollbar{display:none}
/* FORM */
.fg{margin-bottom:16px}
.flabel{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;display:block}
/* All text inputs use font-size:16px minimum to prevent iOS auto-zoom on focus */
.finput{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;color:var(--t1);font-family:inherit;font-size:16px;padding:11px 14px;outline:none;transition:border-color var(--trans)}
.finput:focus{border-color:var(--teal)}
.fselect{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;color:var(--t1);font-family:inherit;font-size:16px;padding:11px 14px;outline:none;appearance:none;-webkit-appearance:none}
.ftextarea{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;color:var(--t1);font-family:inherit;font-size:16px;padding:11px 14px;outline:none;resize:none;min-height:80px;transition:border-color var(--trans)}
.ftextarea:focus{border-color:var(--teal)}
/* CHIPS */
.chip-grid{display:flex;flex-wrap:wrap;gap:8px}
.mchip{padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700;border:1.5px solid var(--border2);color:var(--t2);cursor:pointer;background:var(--bg3);transition:all var(--trans)}
.mchip.sel{background:rgba(0,217,217,0.12);border-color:var(--teal);color:var(--teal)}
.echip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 12px;border-radius:12px;font-size:11px;font-weight:700;border:1.5px solid var(--border2);color:var(--t2);cursor:pointer;background:var(--bg3);transition:all var(--trans);text-align:center;min-width:64px}
.echip.sel{background:rgba(157,78,221,0.12);border-color:var(--purple);color:var(--purple)}
/* SESSION PHASES */
.phase-section{margin:0 16px 6px}
.phase-hdr{display:flex;align-items:center;gap:8px;padding:8px 0 6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.phase-hdr-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.phase-hdr-label{font-size:12px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;flex:1}
.phase-hdr-add{font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--t2);cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.phase-hdr-add:active{background:var(--bg4)}
.phase-hdr-chev{width:14px;height:14px;color:var(--t3);transition:transform var(--trans)}
.phase-hdr-chev.open{transform:rotate(90deg)}
.phase-body{display:block}
.phase-body.collapsed{display:none}
/* PHASE COLORS */
.phase-warmup .phase-hdr-icon{background:rgba(93,168,255,0.15)}
.phase-warmup .phase-hdr-label{color:var(--blue)}
.phase-workout .phase-hdr-icon{background:rgba(0,217,217,0.12)}
.phase-workout .phase-hdr-label{color:var(--teal)}
.phase-cooldown .phase-hdr-icon{background:rgba(157,78,221,0.12)}
.phase-cooldown .phase-hdr-label{color:var(--purple)}
/* COLLAPSED EXERCISE CARD (minimized summary) */
.ex-card-mini{margin:0 0 6px;background:var(--bg3);border:1px solid var(--border1);border-radius:12px;overflow:hidden;transition:border-color var(--trans)}
.ex-card-mini.completed{border-color:rgba(61,220,132,0.25);background:rgba(61,220,132,0.04)}
.ex-card-mini-hdr{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.ex-card-mini-hdr:active{background:rgba(255,255,255,0.03)}
.ex-mini-icon{width:26px;height:26px;border-radius:7px;background:var(--bg4);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ex-mini-icon.done-icon{background:rgba(61,220,132,0.18)}
.ex-mini-name{font-size:13px;font-weight:700;color:var(--t1);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-mini-meta{font-size:11px;color:var(--t2);white-space:nowrap;flex-shrink:0}
.ex-mini-chev{color:var(--t3);flex-shrink:0;transition:transform var(--trans)}
/* SET DOTS PREVIEW */
.ex-mini-sets{padding:0 12px 10px;display:flex;flex-wrap:wrap;gap:4px}
.set-dot{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;letter-spacing:-0.3px;background:var(--bg4);color:var(--t3);border:1px solid var(--border1)}
.set-dot.dot-done{background:rgba(61,220,132,0.15);color:var(--green);border-color:rgba(61,220,132,0.3)}
.set-dot.dot-wu{background:rgba(255,215,0,0.1);color:var(--gold);border-color:rgba(255,215,0,0.25)}
/* DONE BUTTON at bottom of ex-card */
.ex-done-row{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border1);background:var(--bg2)}
.btn-done-ex{flex:1;padding:9px 0;border-radius:10px;border:none;background:rgba(61,220,132,0.12);color:var(--green);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background var(--trans)}
.btn-done-ex:active{background:rgba(61,220,132,0.22)}
.btn-collapse-ex{width:40px;padding:9px 0;border-radius:10px;border:1px solid var(--border2);background:var(--bg3);color:var(--t2);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--trans)}
.btn-collapse-ex:active{background:var(--bg4)}
/* EQUIPMENT MORE PICKER */
.equip-primary{display:flex;gap:6px;flex-wrap:wrap}
.equip-primary-chip{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:10px;font-size:12px;font-weight:700;border:1.5px solid var(--border2);color:var(--t2);cursor:pointer;background:var(--bg3);transition:all var(--trans)}
.equip-primary-chip.sel{background:rgba(157,78,221,0.12);border-color:var(--purple);color:var(--purple)}
.equip-more-btn{padding:7px 12px;border-radius:10px;font-size:12px;font-weight:700;border:1.5px dashed var(--border2);color:var(--t3);cursor:pointer;background:transparent;transition:all var(--trans)}
.equip-more-btn:active{background:var(--bg3)}
/* FOCUS-ADVANCE INPUT */
.set-inp-row{display:flex;gap:6px;align-items:center}
/* PHASE TIMER */
.phase-timer-row{display:flex;align-items:center;gap:8px;padding:6px 0 10px;font-size:12px;color:var(--t2)}
.phase-timer-val{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;min-width:42px}
.phase-timer-btn{padding:4px 10px;border-radius:7px;border:1px solid var(--border2);background:var(--bg3);color:var(--t2);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;transition:all var(--trans)}
.phase-timer-btn:active{background:var(--bg4)}
.phase-timer-btn.active{background:rgba(0,217,217,0.1);border-color:rgba(0,217,217,0.3);color:var(--teal)}
/* REORDER — side by side */
.reorder-btns{display:flex;flex-direction:row;gap:3px;flex-shrink:0}
.reorder-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t3);border-radius:8px;background:var(--bg3);border:1px solid var(--border1);-webkit-tap-highlight-color:transparent;transition:all var(--trans)}
.reorder-btn:active{background:var(--bg4);color:var(--teal);border-color:rgba(0,217,217,0.3)}
/* PRESETS */
.preset-card{margin:0 16px 10px;background:var(--bg2);border:1px solid var(--border1);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color var(--trans)}
.preset-card:active{border-color:var(--border2)}
.preset-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px}
.preset-name{flex:1;font-size:14px;font-weight:700;color:var(--t1)}
.preset-meta{font-size:11px;color:var(--t2);margin-top:2px}
/* SESSION HDR */
.sess-hdr{margin:12px 16px;border:1px solid rgba(0,217,217,0.2);border-radius:16px;padding:14px 16px;background:linear-gradient(135deg,rgba(0,217,217,0.06),rgba(157,78,221,0.06))}
.sess-title{font-size:18px;font-weight:800;color:var(--t1)}
.sess-meta{font-size:12px;color:var(--t2);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.sess-timer-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.sess-timer-val{font-size:28px;font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums}
.sess-timer-lbl{font-size:10px;color:var(--t2);letter-spacing:1px;text-transform:uppercase}
/* EX CARD */
.ex-card{margin:0 0 8px;background:var(--bg2);border:1px solid var(--border1);border-radius:14px;overflow:hidden}
.ex-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg3);border-bottom:1px solid var(--border1)}
.ex-name{flex:1;font-size:15px;font-weight:700;color:var(--t1)}
.ex-meta{font-size:11px;color:var(--t2);margin-top:2px}
.ex-body{padding:12px 14px}
.ex-hint{font-size:11px;color:var(--teal);margin-bottom:8px;display:flex;align-items:center;gap:4px;background:rgba(0,217,217,0.08);border-radius:8px;padding:6px 10px}
/* SET ROW */
.set-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border1)}
.set-row:last-child{border-bottom:none}
.set-num{width:22px;height:22px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--t2);flex-shrink:0}
.set-num.done{background:rgba(61,220,132,0.2);color:var(--green)}
.set-inp{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--t1);font-family:inherit;font-size:16px;padding:7px 10px;outline:none;text-align:center;min-width:0;transition:border-color var(--trans)}
.set-inp:focus{border-color:var(--teal)}
.set-chk{width:28px;height:28px;border-radius:8px;background:var(--bg3);border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--trans);flex-shrink:0}
.set-chk.done{background:rgba(61,220,132,0.2);border-color:var(--green)}
/* PROGRESS BAR */
.prog-wrap{height:3px;background:var(--bg4);border-radius:2px;margin:0 16px 16px}
.prog-bar{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--teal),var(--purple));transition:width 0.4s ease}
/* HISTORY */
.h-card{margin:0 16px 10px;background:var(--bg2);border:1px solid var(--border1);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color var(--trans)}
.h-card:active{border-color:var(--border2)}
.h-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border1)}
.h-date{font-size:14px;font-weight:700;color:var(--t1)}
.h-dur{font-size:12px;color:var(--t2)}
.h-body{padding:10px 14px}
.h-muscles{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.h-exs{font-size:12px;color:var(--t2)}
/* CALENDAR */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.cal-month{font-size:16px;font-weight:700;color:var(--t1)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 16px}
.cal-dow{text-align:center;font-size:10px;font-weight:700;color:var(--t3);padding:4px 0}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;color:var(--t2);transition:all var(--trans);position:relative}
.cal-day.today{color:var(--teal);font-weight:800}
.cal-day.today::after,.cal-day.has-wo::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--purple)}
.cal-day.today::after{background:var(--teal)}
.cal-day.has-wo{color:var(--t1)}
.cal-day.today.has-wo::after{background:var(--teal)}
.cal-day:active{background:var(--bg3)}
.cal-day.other-m{opacity:0.3}
/* REST OVERLAY */
/* ═══════════════════════════════════════════════════
   HOME SCREEN — BowlingDB-inspired redesign
═══════════════════════════════════════════════════ */
#home-hero {
  text-align:center;
  padding:28px 16px 16px;
}
.home-title {
  font-size:42px;
  font-weight:900;
  color:var(--t1);
  letter-spacing:-1.5px;
  line-height:1;
}
.home-title-accent {
  color:var(--purple);
}
.home-version {
  font-size:11px;
  font-weight:700;
  color:var(--t3);
  letter-spacing:3px;
  text-transform:uppercase;
  margin-top:6px;
}
/* Stat cards */
#home-stats {
  display:flex;
  gap:10px;
  padding:0 14px 20px;
}
.home-stat-card {
  flex:1;
  background:var(--bg2);
  border:1px solid var(--border2);
  border-radius:16px;
  padding:14px 10px 12px;
  text-align:center;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:transform 0.15s, border-color 0.15s;
  -webkit-tap-highlight-color:transparent;
  /* Glow effect matching BowlingDB */
  box-shadow:0 0 0 1px rgba(0,217,217,0.0), 0 4px 24px rgba(0,0,0,0.3);
}
.home-stat-card::before {
  content:'';
  position:absolute;
  inset:0;
  border-radius:16px;
  border:1.5px solid transparent;
  background:linear-gradient(135deg,rgba(0,217,217,0.35),rgba(157,78,221,0.35)) border-box;
  -webkit-mask:linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:destination-out;
  mask-composite:exclude;
  pointer-events:none;
}
.home-stat-card:active {
  transform:scale(0.96);
}
.home-stat-val {
  font-size:34px;
  font-weight:900;
  background:linear-gradient(135deg,var(--teal),var(--purple));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  line-height:1.1;
  letter-spacing:-1px;
  font-variant-numeric:tabular-nums;
}
.home-stat-lbl {
  font-size:9px;
  font-weight:700;
  color:var(--t3);
  letter-spacing:1px;
  text-transform:uppercase;
  margin-top:5px;
  line-height:1.3;
}
.home-stat-arrow {
  position:absolute;
  bottom:8px;
  right:8px;
  color:var(--t3);
}
/* Navigation icon grid */
#home-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:0 14px 8px;
}
.home-tile {
  background:transparent;
  border-radius:20px;
  padding:18px 8px 14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  cursor:pointer;
  transition:transform 0.15s, background 0.15s;
  -webkit-tap-highlight-color:transparent;
  position:relative;
  overflow:hidden;
}
.home-tile:active {
  transform:scale(0.94);
  background:rgba(255,255,255,0.04);
}
.home-tile-icon {
  width:52px;
  height:52px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  flex-shrink:0;
}
.home-tile-lbl {
  font-size:10px;
  font-weight:700;
  color:var(--t2);
  letter-spacing:0.8px;
  text-transform:uppercase;
  text-align:center;
  line-height:1.2;
}
/* Tile icon gradient backgrounds */
.tile-start   { background:linear-gradient(135deg,rgba(0,217,217,0.25),rgba(157,78,221,0.3)); }
.tile-presets { background:linear-gradient(135deg,rgba(157,78,221,0.25),rgba(0,217,217,0.2)); }
.tile-exlib   { background:linear-gradient(135deg,rgba(93,168,255,0.2),rgba(157,78,221,0.25)); }
.tile-history { background:linear-gradient(135deg,rgba(255,215,0,0.15),rgba(61,220,132,0.2)); }
.tile-cal     { background:linear-gradient(135deg,rgba(61,220,132,0.15),rgba(0,217,217,0.2)); }
.tile-backup  { background:linear-gradient(135deg,rgba(93,168,255,0.15),rgba(61,220,132,0.15)); }
.tile-reset   { background:rgba(232,93,76,0.12); }
.log-mode-toggle{display:flex;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;overflow:hidden;margin-top:4px}
.log-mode-opt{flex:1;padding:8px 0;text-align:center;font-size:12px;font-weight:700;color:var(--t3);cursor:pointer;transition:all var(--trans);-webkit-tap-highlight-color:transparent}
.log-mode-opt.active{background:var(--bg4);color:var(--t1);}
.log-mode-opt.active.hold{color:var(--purple);}
.log-mode-opt.active.reps{color:var(--teal);}
.ex-filter-bar{position:sticky;top:0;z-index:15;background:var(--bg1);border-bottom:1px solid var(--border1);padding:8px 16px 10px}
.ex-filter-title{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.ex-filter-clear{font-size:11px;color:var(--teal);cursor:pointer;font-weight:700}
.ex-filter-bubbles{display:flex;flex-wrap:wrap;gap:5px}
.ex-fbubble{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:700;border:1.5px solid var(--border2);color:var(--t3);cursor:pointer;background:var(--bg3);transition:all var(--trans);white-space:nowrap;-webkit-tap-highlight-color:transparent}
.ex-fbubble.sel{border-color:var(--teal);color:var(--teal);background:rgba(0,217,217,0.10)}
.ex-fbubble.cat-upper.sel{border-color:#5da8ff;color:#5da8ff;background:rgba(93,168,255,0.10)}
.ex-fbubble.cat-core.sel{border-color:var(--gold);color:var(--gold);background:rgba(255,215,0,0.10)}
.ex-fbubble.cat-lower.sel{border-color:var(--green);color:var(--green);background:rgba(61,220,132,0.10)}
.ex-fbubble.cat-stretch.sel{border-color:var(--purple);color:var(--purple);background:rgba(157,78,221,0.10)}
.ex-fbubble.cat-cardio.sel{border-color:var(--teal);color:var(--teal);background:rgba(0,217,217,0.10)}
/* Exercise category section headers */
.ex-cat-hdr{padding:10px 16px 4px;font-size:10px;font-weight:800;color:var(--t3);letter-spacing:1.2px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.ex-cat-line{flex:1;height:1px;background:var(--border1)}
/* === STRETCH CARD in session === */
.stretch-card{margin:0 0 8px;background:var(--bg2);border:1px solid rgba(157,78,221,0.25);border-radius:14px;overflow:hidden}
.stretch-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(157,78,221,0.06);border-bottom:1px solid var(--border1)}
.stretch-name{flex:1;font-size:15px;font-weight:700;color:var(--t1)}
.stretch-body{padding:12px 14px}
.stretch-set-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border1)}
.stretch-set-row:last-child{border-bottom:none}
.stretch-set-num{width:22px;height:22px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--t2);flex-shrink:0}
.stretch-set-num.done{background:rgba(157,78,221,0.25);color:var(--purple)}
/* Hold time stepper — same pattern as weight */
.hold-stepper{display:flex;align-items:center;gap:0;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;overflow:hidden;flex-shrink:0;flex:1}
.hold-stepper-btn{width:36px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;font-weight:700;color:var(--purple);flex-shrink:0;-webkit-tap-highlight-color:transparent;user-select:none}
.hold-stepper-btn:active{background:var(--bg4)}
.hold-stepper-time{flex:1;background:transparent;border:none;color:var(--t1);font-family:inherit;font-size:18px;font-weight:800;padding:0;outline:none;text-align:center;font-variant-numeric:tabular-nums;cursor:pointer}
.hold-countdown{font-size:28px;font-weight:800;color:var(--purple);font-variant-numeric:tabular-nums;letter-spacing:-1px;text-align:center;padding:4px 0}
.hold-countdown.running{color:var(--teal)}
.hold-countdown.done-clr{color:var(--green)}
/* === PER-EXERCISE NOTES === */
.ex-note-row{padding:6px 14px 10px;border-top:1px solid var(--border1)}
.ex-note-toggle{font-size:11px;font-weight:700;color:var(--t3);cursor:pointer;display:inline-flex;align-items:center;gap:4px;-webkit-tap-highlight-color:transparent}
.ex-note-toggle:active{color:var(--t2)}
.ex-note-field{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--t1);font-family:inherit;font-size:16px;padding:8px 10px;outline:none;resize:none;min-height:60px;margin-top:6px;transition:border-color var(--trans)}
.ex-note-field:focus{border-color:var(--purple)}
.ex-note-hint{font-size:11px;color:var(--purple);background:rgba(157,78,221,0.08);border:1px solid rgba(157,78,221,0.2);border-radius:7px;padding:5px 9px;margin-bottom:6px;display:flex;align-items:flex-start;gap:5px}
.ex-group{margin-bottom:2px}
.ex-group-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ex-group-hdr:active{background:rgba(255,255,255,0.03)}
.ex-group-lbl{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:1.2px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.ex-group-cnt{background:var(--bg3);color:var(--t2);border-radius:20px;font-size:10px;font-weight:700;padding:2px 8px}
.ex-group-chev{width:16px;height:16px;color:var(--t3);transition:transform var(--trans)}
.ex-group-chev.open{transform:rotate(90deg)}
.ex-group-body{display:none}
.ex-group-body.open{display:block}
/* PICKER GROUPS */
.pick-group{margin-bottom:6px}
.pick-group-hdr{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--bg3);border-radius:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;border:1px solid var(--border1)}
.pick-group-hdr.focused-grp{background:rgba(0,217,217,0.08);border-color:rgba(0,217,217,0.25)}
.pick-group-lbl{font-size:12px;font-weight:700;color:var(--t2);display:flex;align-items:center;gap:6px}
.pick-group-lbl.focused-txt{color:var(--teal)}
.pick-grp-badge{font-size:10px;font-weight:700;background:var(--bg4);color:var(--t3);padding:2px 7px;border-radius:20px}
.pick-grp-badge.focused-badge{background:rgba(0,217,217,0.15);color:var(--teal)}
.pick-group-body{display:none;padding-top:4px}
.pick-group-body.open{display:block}
.pick-group-chev{width:14px;height:14px;color:var(--t3);transition:transform var(--trans);flex-shrink:0}
.pick-group-chev.open{transform:rotate(90deg)}
/* CARDIO */
.cardio-machine-card{margin:0 16px 10px;background:var(--bg2);border:1px solid var(--border1);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color var(--trans)}
.cardio-machine-card:active{border-color:var(--border2)}
.cardio-machine-hdr{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--border1)}
.cardio-machine-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.cardio-machine-name{flex:1;font-size:15px;font-weight:700;color:var(--t1)}
.cardio-machine-sub{font-size:11px;color:var(--t2);margin-top:2px}
.cardio-log-card{margin:0 0 8px;background:var(--bg2);border:1px solid rgba(0,217,217,0.2);border-radius:14px;overflow:hidden}
.cardio-log-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(135deg,rgba(0,217,217,0.08),rgba(157,78,221,0.06));border-bottom:1px solid var(--border1)}
.cardio-log-icon{font-size:20px;flex-shrink:0}
.cardio-log-name{flex:1;font-size:15px;font-weight:700;color:var(--t1)}
.cardio-log-body{padding:12px 14px}
.cardio-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.cardio-field{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:10px 12px}
.cardio-field-lbl{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.cardio-field-val{font-size:16px;font-weight:800;color:var(--t1);font-variant-numeric:tabular-nums}
.cardio-field-val.teal{color:var(--teal)}
.cardio-live-timer{background:rgba(0,217,217,0.07);border:1px solid rgba(0,217,217,0.2);border-radius:10px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cardio-live-time{font-size:28px;font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums;letter-spacing:-1px}
.cardio-live-lbl{font-size:10px;color:var(--t2);letter-spacing:1px;text-transform:uppercase}
.level-row{display:flex;align-items:center;gap:10px;margin-top:4px}
.level-slider{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--bg4);outline:none}
.level-slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--purple));cursor:pointer;border:2px solid var(--bg2)}
.level-slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--purple));cursor:pointer;border:2px solid var(--bg2)}
.level-val{font-size:16px;font-weight:800;color:var(--teal);min-width:32px;text-align:center}
.cardio-pill{background:rgba(0,217,217,0.12);color:var(--teal);padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
/* SET ROW DELETE */
.set-del{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t3);flex-shrink:0;transition:color var(--trans)}
.set-del:active{color:var(--red)}
/* MINI REST BADGE — shows in exercise card instead of scrolling away */
.mini-rest{display:none;align-items:center;gap:6px;background:rgba(0,217,217,0.08);border:1px solid rgba(0,217,217,0.2);border-radius:8px;padding:5px 10px;margin-bottom:8px;font-size:12px;font-weight:700;color:var(--teal)}
.mini-rest.active{display:flex}
.mini-rest-time{font-variant-numeric:tabular-nums}
/* SUPERSET REDESIGN */
.ss-section{padding:8px 14px 10px;border-top:1px solid var(--border1)}
.ss-section-lbl{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.ss-group-pills{display:flex;gap:6px;flex-wrap:wrap}
.ss-pill{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800;cursor:pointer;border:1.5px solid var(--border2);background:var(--bg3);color:var(--t3);transition:all var(--trans)}
.ss-pill.active-A{background:rgba(157,78,221,0.15);border-color:rgba(157,78,221,0.5);color:var(--purple)}
.ss-pill.active-B{background:rgba(0,217,217,0.12);border-color:rgba(0,217,217,0.4);color:var(--teal)}
.ss-pill.active-C{background:rgba(255,215,0,0.10);border-color:rgba(255,215,0,0.35);color:var(--gold)}
.ss-pill.active-D{background:rgba(93,168,255,0.12);border-color:rgba(93,168,255,0.4);color:var(--blue)}
.ss-clear{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid rgba(232,93,76,0.3);background:rgba(232,93,76,0.08);color:var(--red)}
.set-row.warmup{opacity:0.65}
.warmup-badge{font-size:9px;font-weight:800;color:var(--gold);background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.25);border-radius:5px;padding:1px 5px;letter-spacing:0.3px;flex-shrink:0}
/* SS CONNECTOR LINE */
.ss-connector{display:flex;justify-content:center;height:10px;margin:0 16px}
.ss-connector-line{width:3px;border-radius:2px;height:100%}
/* COOLDOWN TIMER CARD */
.cooldown-card{margin:0 16px 12px;background:linear-gradient(135deg,rgba(93,168,255,0.08),rgba(157,78,221,0.06));border:1px solid rgba(93,168,255,0.25);border-radius:14px;padding:14px 16px}
.cooldown-title{font-size:14px;font-weight:700;color:var(--blue);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.cooldown-time{font-size:32px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums;letter-spacing:-1px}
/* POSITION/ANGLE CHIPS */
.pos-chip{padding:5px 12px;border-radius:8px;font-size:11px;font-weight:700;border:1px solid var(--border2);color:var(--t2);cursor:pointer;background:var(--bg3);transition:all var(--trans)}
.pos-chip.sel{background:rgba(0,217,217,0.12);border-color:var(--teal);color:var(--teal)}
/* LOG SET BUTTON */
.btn-log-set{flex:1;padding:8px 0;border-radius:9px;border:1px solid var(--border2);background:var(--bg3);color:var(--t2);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all var(--trans);-webkit-tap-highlight-color:transparent}
.btn-log-set:active{background:var(--bg4)}
.btn-log-set.ready{background:rgba(61,220,132,0.12);color:var(--green);border-color:rgba(61,220,132,0.3)}
/* AB MODE */
.ab-section{padding:8px 14px 10px;border-top:1px solid var(--border1);background:rgba(61,220,132,0.03)}
.ab-section-lbl{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.ab-toggle{display:flex;align-items:center;gap:6px;cursor:pointer}
.ab-toggle-sw{width:36px;height:20px;border-radius:10px;background:var(--bg4);border:1px solid var(--border2);position:relative;transition:background var(--trans);flex-shrink:0}
.ab-toggle-sw.on{background:rgba(61,220,132,0.3);border-color:rgba(61,220,132,0.5)}
.ab-toggle-sw::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--t3);transition:all var(--trans)}
.ab-toggle-sw.on::after{left:18px;background:var(--green)}
.ab-set-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(61,220,132,0.1)}
.ab-set-row:last-child{border-bottom:none}
.ab-set-num{width:20px;height:20px;border-radius:50%;background:rgba(61,220,132,0.15);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--green);flex-shrink:0}
.ab-done-row{display:flex;align-items:center;gap:6px;background:rgba(61,220,132,0.06);border:1px solid rgba(61,220,132,0.15);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--green)}
.ab-picker-row{margin-top:6px;display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:9px 12px;cursor:pointer}
.ab-picker-name{flex:1;font-size:13px;font-weight:700;color:var(--t1)}
.ab-picker-sub{font-size:11px;color:var(--t2)}
.ab-inline-header{font-size:11px;font-weight:800;color:var(--green);letter-spacing:0.5px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
/* INLINE REST TIMER (replaces full-screen overlay) */
.rest-inline{background:linear-gradient(135deg,rgba(0,217,217,0.08),rgba(157,78,221,0.08));border:1px solid rgba(0,217,217,0.25);border-radius:14px;padding:12px 16px;margin:0 16px 12px;display:none}
.rest-inline.open{display:block}
.rest-inline-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rest-inline-time{font-size:36px;font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums;letter-spacing:-1px}
.rest-inline-lbl{font-size:10px;color:var(--t2);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.rest-arc-wrap{position:relative;width:56px;height:56px;flex-shrink:0}
.rest-arc-wrap svg{transform:rotate(-90deg)}
.rest-arc-track{fill:none;stroke:var(--bg4);stroke-width:5}
.rest-arc-prog{fill:none;stroke:var(--teal);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.rest-inline-btns{display:flex;gap:5px}
.rest-inline-btns button{flex:1;padding:7px 0;font-size:11px;font-weight:700;border-radius:9px;border:1px solid var(--border2);background:var(--bg3);color:var(--t1);cursor:pointer;font-family:inherit;white-space:nowrap}
.rest-inline-btns button:active{background:var(--bg4)}
.rest-sub-btn{color:var(--t2)!important;border-color:rgba(255,255,255,0.06)!important}
.rest-skip-btn{color:var(--red)!important;border-color:rgba(232,93,76,0.3)!important;flex:0.7!important}
.rest-add-btn{color:var(--teal)!important;border-color:rgba(0,217,217,0.25)!important}
/* SUPERSET BADGE */
.ss-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(157,78,221,0.15);border:1px solid rgba(157,78,221,0.3);color:var(--purple);border-radius:6px;font-size:10px;font-weight:800;padding:2px 7px;letter-spacing:0.5px}
.ss-link{width:2px;height:16px;background:rgba(157,78,221,0.4);margin:0 auto}
/* WEIGHT STEPPER */
.w-stepper{display:flex;align-items:center;gap:0;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;overflow:hidden;flex-shrink:0;max-width:120px}
.w-stepper-btn{width:32px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;font-weight:700;color:var(--teal);flex-shrink:0;-webkit-tap-highlight-color:transparent;user-select:none}
.w-stepper-btn:active{background:var(--bg4)}
.w-stepper-inp{flex:1;background:transparent;border:none;color:var(--t1);font-family:inherit;font-size:16px;font-weight:700;padding:0;outline:none;text-align:center;min-width:0;width:100%}
/* EQUIPMENT OVERRIDE on exercise card */
.ex-equip-chips{display:flex;gap:5px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--border1);background:var(--bg2)}
.ex-echip{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;border:1px solid var(--border2);color:var(--t2);cursor:pointer;background:var(--bg3);transition:all var(--trans)}
.ex-echip.sel{background:rgba(157,78,221,0.12);border-color:var(--purple);color:var(--purple)}
/* === WORKOUT PLANNER === */
#s-log.planning .planner-view{display:flex;flex-direction:column}
#s-log.planning .session-view{display:none}
#s-log.active-session .planner-view{display:none}
#s-log.active-session .session-view{display:block}
.planner-view{display:flex;flex-direction:column;padding-bottom:calc(var(--safe-b)+120px)}
.session-view{display:none}
.planner-hdr{padding:14px 16px 10px}
.planner-name-input{width:100%;background:transparent;border:none;border-bottom:2px solid var(--border2);font-size:20px;font-weight:800;color:var(--t1);font-family:inherit;outline:none;padding:0 0 6px;transition:border-color var(--trans)}
.planner-name-input:focus{border-bottom-color:var(--teal)}
.planner-name-input::placeholder{color:var(--t3)}
.planner-day-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.plan-phase{margin:0 16px 4px}
.plan-phase-hdr{display:flex;align-items:center;gap:8px;padding:10px 0 6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.plan-phase-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.plan-phase-lbl{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;flex:1}
.plan-phase-add{font-size:11px;font-weight:700;padding:5px 11px;border-radius:9px;border:1px solid var(--border2);background:var(--bg3);color:var(--teal);cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;gap:3px}
.plan-phase-add:active{background:var(--bg4)}
.plan-phase-chev{width:14px;height:14px;color:var(--t3);transition:transform var(--trans);flex-shrink:0}
.plan-phase-chev.open{transform:rotate(90deg)}
.plan-phase-body{display:flex;flex-direction:column;gap:0}
.plan-phase-body.collapsed{display:none}
.plan-phase-warmup .plan-phase-icon{background:rgba(93,168,255,0.15)}
.plan-phase-warmup .plan-phase-lbl{color:#5da8ff}
.plan-phase-workout .plan-phase-icon{background:rgba(0,217,217,0.12)}
.plan-phase-workout .plan-phase-lbl{color:var(--teal)}
.plan-phase-cooldown .plan-phase-icon{background:rgba(157,78,221,0.12)}
.plan-phase-cooldown .plan-phase-lbl{color:var(--purple)}
/* Plan exercise card */
.plan-ex-card{background:var(--bg2);border:1px solid var(--border1);border-radius:12px;overflow:hidden;margin-bottom:4px;transition:border-color var(--trans)}
.plan-ex-card.ss-A{border-left:3px solid var(--purple)}
.plan-ex-card.ss-B{border-left:3px solid var(--teal)}
.plan-ex-card.ss-C{border-left:3px solid var(--gold)}
.plan-ex-card.ss-D{border-left:3px solid var(--green)}
.plan-ex-hdr{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.plan-ex-name{font-size:13px;font-weight:700;color:var(--t1);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-ex-summary{font-size:11px;color:var(--t3);white-space:nowrap;flex-shrink:0}
.plan-ex-body{padding:10px 12px 12px;border-top:1px solid var(--border1)}
.plan-cfg-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.plan-cfg-cell{display:flex;flex-direction:column;gap:5px}
.plan-cfg-lbl{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:0.8px;text-transform:uppercase;text-align:center}
.plan-cfg-inp{background:var(--bg3);border:1px solid var(--border2);border-radius:9px;color:var(--t1);font-family:inherit;font-size:16px;font-weight:700;padding:9px 8px;outline:none;text-align:center;width:100%;transition:border-color var(--trans)}
.plan-cfg-inp:focus{border-color:var(--teal)}
.plan-rest-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.plan-rest-lbl{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:0.8px;text-transform:uppercase;width:100%;margin-bottom:2px}
.plan-rest-chip{padding:5px 11px;border-radius:7px;font-size:11px;font-weight:700;border:1px solid var(--border2);background:var(--bg3);color:var(--t2);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all var(--trans)}
.plan-rest-chip.sel{background:rgba(0,217,217,0.12);border-color:var(--teal);color:var(--teal)}
.plan-rest-inp{width:52px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--t1);font-size:12px;font-weight:700;padding:5px 6px;outline:none;text-align:center;font-family:inherit}
.plan-ss-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.plan-ss-lbl{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:0.8px;text-transform:uppercase;white-space:nowrap}
.plan-ss-pills{display:flex;gap:5px}
.plan-ss-pill{width:30px;height:28px;border-radius:7px;font-size:11px;font-weight:800;border:1.5px solid var(--border2);background:var(--bg3);color:var(--t3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--trans);-webkit-tap-highlight-color:transparent}
.plan-ss-pill.on-A{background:rgba(157,78,221,0.18);border-color:var(--purple);color:var(--purple)}
.plan-ss-pill.on-B{background:rgba(0,217,217,0.14);border-color:var(--teal);color:var(--teal)}
.plan-ss-pill.on-C{background:rgba(255,215,0,0.13);border-color:var(--gold);color:var(--gold)}
.plan-ss-pill.on-D{background:rgba(61,220,132,0.13);border-color:var(--green);color:var(--green)}
.plan-ex-footer{display:flex;align-items:center;gap:6px;margin-top:4px}
.plan-ss-connector{height:8px;margin:0 12px;position:relative}
.plan-ss-connector::before{content:'';position:absolute;left:16px;top:0;bottom:0;width:3px;border-radius:0}
.plan-ss-conn-A::before{background:rgba(157,78,221,0.45)}
.plan-ss-conn-B::before{background:rgba(0,217,217,0.4)}
.plan-ss-conn-C::before{background:rgba(255,215,0,0.4)}
.plan-ss-conn-D::before{background:rgba(61,220,132,0.4)}
.plan-load-strip{margin:4px 16px 8px;background:var(--bg2);border:1px solid var(--border1);border-radius:11px;padding:11px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background var(--trans)}
.plan-load-strip:active{background:var(--bg3)}
.planner-actions{padding:12px 16px;display:flex;flex-direction:column;gap:8px;background:var(--bg0);border-top:1px solid var(--border1);position:sticky;bottom:calc(var(--safe-b)+60px);z-index:10}
.planner-actions-row{display:flex;gap:8px}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div id="hdr-back" onclick="handleBack()" style="display:none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </div>
    <div id="hdr-title">WorkoutDB</div>
    <div id="hdr-action"></div>
  </div>

  <div id="content">
    <!-- HOME -->
    <div id="s-home" class="screen active">
      <!-- Hero title -->
      <div id="home-hero">
        <div class="home-title">Workout<span class="home-title-accent">DB</span></div>
        <div class="home-version">V 2.6</div>
      </div>
      <!-- Stat cards row -->
      <div id="home-stats"></div>
      <!-- Navigation icon grid -->
      <div id="home-grid"></div>
      <!-- Recent sessions -->
      <div id="home-recent-wrap">
        <div class="sec-hdr" style="margin-top:8px">Recent</div>
        <div id="home-recent"></div>
      </div>
    </div>

    <!-- WORKOUT TAB: two states — planning | active-session -->
    <div id="s-log" class="screen planning">

      <!-- ═══════════════════════════════ PLANNER VIEW ═══════════════════════════ -->
      <div class="planner-view">

        <!-- Header: workout name + day selector -->
        <div class="planner-hdr">
          <input class="planner-name-input" id="plan-name" type="text" placeholder="Workout name…" autocomplete="off">
          <div class="planner-day-row">
            <select class="fselect" id="plan-day" style="flex:1;font-size:13px;padding:8px 12px"></select>
            <div style="display:flex;gap:6px;flex-wrap:wrap;flex:2" id="plan-muscles"></div>
          </div>
        </div>

        <!-- Load from preset strip -->
        <div class="plan-load-strip" onclick="planLoadPreset()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <div style="flex:1">
            <div style="font-size:13px;font-weight:700;color:var(--t1)">Load Preset</div>
            <div style="font-size:11px;color:var(--t2)">Start from a saved routine</div>
          </div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>

        <!-- Phase: Warm Up -->
        <div class="plan-phase plan-phase-warmup" id="planphase-warmup">
          <div class="plan-phase-hdr" onclick="togglePlanPhase('warmup')">
            <div class="plan-phase-icon">🏃</div>
            <div class="plan-phase-lbl">Warm Up</div>
            <div class="plan-phase-add" onclick="event.stopPropagation();planAddEx('warmup')">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add
            </div>
            <svg class="plan-phase-chev open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </div>
          <div class="plan-phase-body" id="plan-body-warmup"></div>
        </div>

        <!-- Phase: Workout -->
        <div class="plan-phase plan-phase-workout" id="planphase-workout">
          <div class="plan-phase-hdr" onclick="togglePlanPhase('workout')">
            <div class="plan-phase-icon">💪</div>
            <div class="plan-phase-lbl">Workout</div>
            <div class="plan-phase-add" onclick="event.stopPropagation();planAddEx('workout')">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add
            </div>
            <svg class="plan-phase-chev open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </div>
          <div class="plan-phase-body" id="plan-body-workout"></div>
        </div>

        <!-- Phase: Cool Down -->
        <div class="plan-phase plan-phase-cooldown" id="planphase-cooldown">
          <div class="plan-phase-hdr" onclick="togglePlanPhase('cooldown')">
            <div class="plan-phase-icon">❄️</div>
            <div class="plan-phase-lbl">Cool Down</div>
            <div class="plan-phase-add" onclick="event.stopPropagation();planAddEx('cooldown')">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add
            </div>
            <svg class="plan-phase-chev open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </div>
          <div class="plan-phase-body" id="plan-body-cooldown"></div>
        </div>

        <!-- Action buttons -->
        <div class="planner-actions">
          <button class="btn btn-primary" onclick="launchPlan()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Launch Workout
          </button>
          <div class="planner-actions-row">
            <button class="btn btn-ghost" style="flex:1;font-size:12px" onclick="savePlanAsPreset()">📋 Save as Preset</button>
            <button class="btn btn-ghost" style="flex:1;font-size:12px" onclick="clearPlan()">🗑 Clear</button>
          </div>
        </div>
      </div>

      <!-- ═══════════════════════════════ ACTIVE SESSION VIEW ══════════════════════ -->
      <div class="session-view">
        <div id="log-hdr"></div>
        <!-- INLINE REST TIMER -->
        <div class="rest-inline" id="rest-inline">
          <div class="rest-inline-top">
            <div>
              <div class="rest-inline-lbl">Rest</div>
              <div class="rest-inline-time" id="rest-time-txt">1:30</div>
            </div>
            <div class="rest-arc-wrap">
              <svg width="56" height="56" viewBox="0 0 56 56">
                <circle class="rest-arc-track" cx="28" cy="28" r="24"/>
                <circle class="rest-arc-prog" id="rest-prog-c" cx="28" cy="28" r="24" stroke-dasharray="150" stroke-dashoffset="0"/>
              </svg>
            </div>
          </div>
          <div class="rest-inline-btns">
            <button class="rest-sub-btn" onclick="addRestTime(-30)">−30s</button>
            <button class="rest-sub-btn" onclick="addRestTime(-15)">−15s</button>
            <button class="rest-skip-btn" onclick="skipRest()">✕</button>
            <button class="rest-add-btn" onclick="addRestTime(15)">+15s</button>
            <button class="rest-add-btn" onclick="addRestTime(30)">+30s</button>
          </div>
        </div>
        <div class="prog-wrap"><div class="prog-bar" id="sess-prog" style="width:0%"></div></div>

        <!-- PHASE: WARMUP -->
        <div class="phase-section phase-warmup" id="phase-warmup">
          <div class="phase-hdr" onclick="togglePhase('warmup')">
            <div class="phase-hdr-icon">🏃</div>
            <div class="phase-hdr-label">Warm Up</div>
            <div class="phase-hdr-add" onclick="event.stopPropagation();addExToSession('warmup')">+ Add</div>
            <svg class="phase-hdr-chev open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </div>
          <div class="phase-timer-row" id="phase-timer-warmup" style="padding:8px 0 4px">
            <div class="phase-timer-val" id="ptv-warmup">0:00</div>
            <button class="phase-timer-btn" id="ptb-warmup" onclick="togglePhaseTimer('warmup')">▶ Start Timer</button>
            <button class="phase-timer-btn" id="pts-warmup" onclick="stopPhaseTimer('warmup')" style="display:none;color:var(--red);border-color:rgba(232,93,76,0.3)">⏹ Stop &amp; Save</button>
            <input type="number" inputmode="decimal" placeholder="min" id="ptm-warmup"
              style="width:46px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--t2);font-size:11px;font-weight:700;padding:3px 6px;outline:none;text-align:center;font-family:inherit"
              onchange="setPhaseTimerManual('warmup',this.value)" title="Override minutes">
            <span style="font-size:11px;color:var(--t3)">stretch / rolling</span>
          </div>
          <div class="phase-body" id="phase-body-warmup"></div>
        </div>

        <!-- PHASE: WORKOUT -->
        <div class="phase-section phase-workout" id="phase-workout">
          <div class="phase-hdr" onclick="togglePhase('workout')">
            <div class="phase-hdr-icon">💪</div>
            <div class="phase-hdr-label">Workout</div>
            <div class="phase-hdr-add" onclick="event.stopPropagation();addExToSession('workout')">+ Add</div>
            <svg class="phase-hdr-chev open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </div>
          <div class="phase-body" id="phase-body-workout"></div>
        </div>

        <!-- PHASE: COOLDOWN -->
        <div class="phase-section phase-cooldown" id="phase-cooldown">
          <div class="phase-hdr" onclick="togglePhase('cooldown')">
            <div class="phase-hdr-icon">❄️</div>
            <div class="phase-hdr-label">Cool Down</div>
            <div class="phase-hdr-add" onclick="event.stopPropagation();addExToSession('cooldown')">+ Add</div>
            <svg class="phase-hdr-chev open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </div>
          <div class="phase-timer-row" id="phase-timer-cooldown" style="padding:0 0 8px">
            <div class="phase-timer-val" id="ptv-cooldown">0:00</div>
            <button class="phase-timer-btn" id="ptb-cooldown" onclick="togglePhaseTimer('cooldown')">▶ Start Timer</button>
            <button class="phase-timer-btn" id="pts-cooldown" onclick="stopPhaseTimer('cooldown')" style="display:none;color:var(--red);border-color:rgba(232,93,76,0.3)">⏹ Stop &amp; Save</button>
            <input type="number" inputmode="decimal" placeholder="min" id="ptm-cooldown"
              style="width:46px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--t2);font-size:11px;font-weight:700;padding:3px 6px;outline:none;text-align:center;font-family:inherit"
              onchange="setPhaseTimerManual('cooldown',this.value)" title="Override minutes">
            <span style="font-size:11px;color:var(--t3)">stretch / rolling</span>
          </div>
          <div class="phase-body" id="phase-body-cooldown"></div>
        </div>

        <div style="padding:8px 16px 16px;display:flex;gap:10px">
          <button class="btn btn-primary" style="flex:1;font-size:13px" onclick="endSession()">End Workout</button>
        </div>
      </div>
    </div>

    <!-- EXERCISES -->
    <div id="s-exercises" class="screen"><div id="ex-list"></div></div>

    <!-- HISTORY -->
    <div id="s-history" class="screen"><div id="hist-list"></div></div>

    <!-- PRESETS -->
    <div id="s-presets" class="screen"><div id="presets-list"></div></div>

    <!-- CALENDAR -->
    <div id="s-calendar" class="screen"><div id="cal-view"></div></div>
  </div>

  <div id="nav">
    <div class="nav-btn active" id="nav-home" onclick="navTo('s-home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </div>
    <div class="nav-btn" id="nav-log" onclick="navTo('s-log')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Workout
    </div>
    <div class="nav-btn" id="nav-exercises" onclick="navTo('s-exercises')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14M18 5v14M3 8h3M18 8h3M3 16h3M18 16h3"/></svg>
      Exercises
    </div>
    <div class="nav-btn" id="nav-presets" onclick="navTo('s-presets')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
      Presets
    </div>
    <div class="nav-btn" id="nav-history" onclick="navTo('s-history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><polyline points="12 7 12 12 15 15"/></svg>
      History
    </div>
  </div>

  <div id="fab" onclick="fabAction()" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </div>

  <div id="toast"></div>
  <!-- Hidden file input for data import -->
  <input type="file" id="import-file-input" accept=".json" style="display:none" onchange="handleImportFile(this)">

  <div id="modal-overlay">
    <div id="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-hdr">
        <div class="modal-title-txt" id="modal-title-txt"></div>
        <div class="btn-icon" onclick="closeModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>
</div>

<script>
/* === DATA === */
const DB_KEY = 'workoutdb_v1';
const MUSCLES = ['Chest','Back','Shoulders','Biceps','Triceps','Forearms','Abs','Hips','Lower Back','Quads','Hamstrings','Glutes','Calves','Full Body','Stretching','Cardio'];
const EQUIP_LIST = [

var db = loadDB();
// Migration: rebuild exercises if schema is outdated (no positions field on any exercise)
(function() {
  var needsRebuild = !db.exercises.some(function(e){ return e.positions !== undefined; });
  var hasCardio = db.exercises.some(function(e){ return e.type==='cardio'; });
  var hasStretch = db.exercises.some(function(e){ return e.type==='stretch'; });

  if (needsRebuild) {
    // Very old schema — no positions field at all. Rebuild exercise list but MERGE custom exercises.
    var fresh = freshDB();
    var builtinIds = fresh.exercises.map(function(e){return e.id;});
    var customExs = db.exercises.filter(function(e){ return builtinIds.indexOf(e.id)<0; });
    db.exercises = fresh.exercises.concat(customExs);
    db.ids.exercise = Math.max(db.ids.exercise||1, 250);
    db.schemaVersion = 3;
    saveDB();
  } else if (!hasCardio) {
    // Missing cardio exercises — inject them
    var fresh2 = freshDB();
    fresh2.exercises.filter(function(e){ return e.type==='cardio'; }).forEach(function(e){
      if(!db.exercises.find(function(x){return x.id===e.id;})) db.exercises.push(e);
    });
    db.ids.exercise = Math.max(db.ids.exercise||1, 250);
    db.schemaVersion = 3;
    saveDB();
  }

  // Always inject missing stretch/mobility exercises (safe — checks by ID first)
  if (!hasStretch) {
    var fresh4 = freshDB();
    fresh4.exercises.filter(function(e){ return e.type==='stretch' || e.id>=150; }).forEach(function(e){
      if(!db.exercises.find(function(x){return x.id===e.id;})) db.exercises.push(e);
    });
    db.ids.exercise = Math.max(db.ids.exercise||1, 250); // ← was 200, caused ID collision
    db.schemaVersion = 3;
    saveDB();
  }

  // Always inject any missing built-in exercises by ID (safe catch-all for future additions)
  (function _injectMissingBuiltins(){
    var fresh6 = freshDB();
    var changed = false;
    fresh6.exercises.forEach(function(e){
      if(!db.exercises.find(function(x){return x.id===e.id;})){
        db.exercises.push(e);
        changed = true;
      }
    });
    if(changed){
      db.ids.exercise = Math.max(db.ids.exercise||1, 250);
      saveDB();
    }
  })();

  if(!db.presets) { db.presets=[]; if(!db.ids.preset) db.ids.preset=1; saveDB(); }
  // Inject built-in presets if none exist yet
  if(db.presets.length===0) {
    var fresh3=freshDB();
    db.presets=fresh3.presets;
    db.ids.preset=12;
    saveDB();
  }
  // Always inject any missing built-in presets by ID (safe catch-all)
  (function _injectMissingPresets(){
    var fresh7=freshDB();
    var changed=false;
    fresh7.presets.filter(function(p){return p.builtin;}).forEach(function(p){
      if(!db.presets.find(function(x){return x.id===p.id;})){
        db.presets.push(p);
        changed=true;
      }
    });
    if(changed){
      db.ids.preset=Math.max(db.ids.preset||1,12);
      saveDB();
    }
  })();

  // Stamp schema version
  if(!db.schemaVersion || db.schemaVersion < 3){
    db.schemaVersion = 3;
    saveDB();
  }
})();

// Screen lock / tab switch recovery — recalculate elapsed from real timestamps
document.addEventListener('visibilitychange', function() {
  if(!G.sess) return;
  if(document.hidden) {
    // Screen locking — record when we went away
    G._pauseAt=Date.now();
  } else {
    // Returning — if interval had fired fine, no correction needed.
    // Re-sync elapsed from real wall-clock time to correct any drift.
    if(G.sessStart) {
      G.elapsed=Math.floor((Date.now()-G.sessStart-G.sessPaused)/1000);
      var el=document.getElementById('sess-elapsed');
      if(el) el.textContent=fmt(G.elapsed);
    }
    // Re-sync rest timer if active
    if(G.restEnd) {
      G.restRem=Math.max(0,Math.round((G.restEnd-Date.now())/1000));
      updateRestDisplay();
    }
    // Re-sync cardio live timer display
    if(G.cardioTimerEi>=0 && G.cardioTimerStart) {
      var elapsed=Math.floor((Date.now()-G.cardioTimerStart)/1000);
      var cel=document.getElementById('clt-'+G.cardioTimerEi);
      if(cel) cel.textContent=fmt(elapsed);
    }
  }
});

/* === UTILS === */
function fmt(secs) {
  secs = secs||0;
  var h=Math.floor(secs/3600), m=Math.floor((secs%3600)/60), s=secs%60;
  if (h>0) return h+':'+pad(m)+':'+pad(s);
  return m+':'+pad(s);
}
function pad(n) { return n<10?'0'+n:String(n); }
function qs(sel,ctx) { return (ctx||document).querySelector(sel); }
function qsa(sel,ctx) { return Array.from((ctx||document).querySelectorAll(sel)); }

  document.getElementById('hdr-title').textContent = titles[sid]||'WorkoutDB';

/* === HOME === */
function renderHome() {
  var today = new Date();
  var ws = new Date(today);
  ws.setDate(today.getDate()-today.getDay()); ws.setHours(0,0,0,0);
  var tw = db.sessions.filter(function(s){ return new Date(s.date)>=ws; });
  var tSets = tw.reduce(function(a,s){
    return a+s.exercises.reduce(function(b,e){
      return b+(e.sets?e.sets.filter(function(x){return x.done&&!x.warmup;}).length:0);
    },0);
  },0);

  // Streak: consecutive days with at least one workout (ending today or yesterday)
  var streak = 0;
  var allDates = db.sessions.map(function(s){
    var d=new Date(s.date); d.setHours(0,0,0,0); return d.getTime();
  });
  var uniqueDays = Array.from(new Set(allDates)).sort(function(a,b){return b-a;});
  if(uniqueDays.length) {
    var check = new Date(today); check.setHours(0,0,0,0);
    // Allow streak if last workout was today or yesterday
    var last = new Date(uniqueDays[0]);
    var gap = (check.getTime()-last.getTime())/(1000*60*60*24);
    if(gap<=1) {
      streak=1;
      var prev=last;
      for(var i=1;i<uniqueDays.length;i++){
        var d=new Date(uniqueDays[i]);
        var diff=(prev.getTime()-d.getTime())/(1000*60*60*24);
        if(Math.round(diff)===1){streak++;prev=d;} else break;
      }
    }
  }

  // ── Stat cards ──
  document.getElementById('home-stats').innerHTML =
    _statCard(tw.length, 'Workouts\nThis Week', 'navTo(\'s-history\')') +
    _statCard(tSets,     'Sets\nThis Week',      'navTo(\'s-history\')') +
    _statCard(streak,    'Day\nStreak',          'navTo(\'s-calendar\')');

  // ── Nav grid ──
  var tiles = [
    {cls:'tile-start',   icon:'💪', label:'Start',     action:'startNewSession()'},
    {cls:'tile-presets', icon:'📋', label:'Presets',   action:'navTo(\'s-presets\')'},
    {cls:'tile-exlib',   icon:'🏋️', label:'Exercises', action:'navTo(\'s-exercises\')'},
    {cls:'tile-history', icon:'📊', label:'History',   action:'navTo(\'s-history\')'},
    {cls:'tile-cal',     icon:'📅', label:'Calendar',  action:'navTo(\'s-calendar\')'},
    {cls:'tile-backup',  icon:'💾', label:'Backup',    action:'openBackupModal()'},
    {cls:'tile-reset',   icon:'🔄', label:'Reset',
      action:'if(confirm(\'Reset all data? This cannot be undone.\')){try{localStorage.clear();}catch(e){}location.reload();}'}
  ];
  document.getElementById('home-grid').innerHTML = tiles.map(function(t){
    return '<div class="home-tile" onclick="'+t.action+'" ontouchstart="">'+
      '<div class="home-tile-icon '+t.cls+'">'+t.icon+'</div>'+
      '<div class="home-tile-lbl">'+t.label+'</div>'+
    '</div>';
  }).join('');

  // ── Recent sessions ──
  var recent = db.sessions.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);}).slice(0,3);
  var rEl = document.getElementById('home-recent');
  if(!recent.length) {
    rEl.innerHTML='<div class="empty" style="padding:32px 32px"><div class="empty-icon">💪</div><div class="empty-label">No workouts yet</div><div class="empty-sub">Tap Start to begin your first session</div></div>';
  } else {
    rEl.innerHTML = recent.map(sessCardHTML).join('');
  }
}

    '<div class="home-stat-val">'+val+'</div>'+

    '<div class="home-stat-arrow"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></div>'+

function sessCardHTML(s) {
  var d=new Date(s.date);
  var ds=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  var muscles=[];
  s.exercises.forEach(function(e){
    var ex=db.exercises.find(function(x){return x.id===e.exerciseId;});
    if(ex) ex.muscles.forEach(function(m){if(muscles.indexOf(m)<0)muscles.push(m);});
  });
  // Safe set count — cardio exercises don't have sets
  var ts=s.exercises.reduce(function(a,e){
    return a+(e.sets?e.sets.filter(function(x){return x.done;}).length:0);
  },0);

    '<div class="h-hdr"><div class="h-date">'+ds+'</div><div class="h-dur">'+fmt(s.duration)+'</div></div>' +

    '<div class="h-exs">'+s.exercises.length+' exercise'+(s.exercises.length!==1?'s':'')+' · '+ts+' set'+(ts!==1?'s':'')+'</div></div></div>';
