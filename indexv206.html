/* === WORKOUT PLANNER ENGINE === */

// G.plan stores the in-progress workout design
// { name, day, muscles, planPhaseOpen, entries: [{id, phase, exerciseId, sets, startWeight, targetReps, restSecs, ssGroup, expanded}] }

function _initPlan() {
  if(!G.plan) {
    G.plan = {
      name: '',
      day: new Date().getDay(),
      muscles: [],
      planPhaseOpen: {warmup:true, workout:true, cooldown:true},
      entries: []
    };
  }
}

function renderPlanner() {
  _initPlan();
  var p = G.plan;

  // Day selector
  var dayEl = document.getElementById('plan-day');
  if(dayEl) {
    dayEl.innerHTML = DAYS_L.map(function(d,i){ return '<option value="'+i+'"'+(i===p.day?' selected':'')+'>'+d+'</option>'; }).join('');
    dayEl.onchange = function(){ p.day = parseInt(this.value); };
  }

  // Workout name
  var nameEl = document.getElementById('plan-name');
  if(nameEl){
    nameEl.value = p.name||'';
    nameEl.oninput = function(){ p.name = this.value; };
  }

  // Muscle chips
  var mEl = document.getElementById('plan-muscles');
  if(mEl){
    mEl.innerHTML = MUSCLES.map(function(m){
      var sel = p.muscles.indexOf(m)>=0;
      return '<div class="mchip'+(sel?' sel':'')+'" style="font-size:11px;padding:5px 10px" onclick="togglePlanMuscle(\''+m+'\',this)">'+m+'</div>';
    }).join('');
  }

  // Render each phase
  ['warmup','workout','cooldown'].forEach(function(phase){
    _renderPlanPhase(phase);
  });
}

function togglePlanMuscle(m, el) {
  _initPlan();
  var idx = G.plan.muscles.indexOf(m);
  if(idx>=0) G.plan.muscles.splice(idx,1);
  else G.plan.muscles.push(m);
  el.classList.toggle('sel', G.plan.muscles.indexOf(m)>=0);
}

function togglePlanPhase(phase) {
  _initPlan();
  G.plan.planPhaseOpen[phase] = !G.plan.planPhaseOpen[phase];
  var bodyEl = document.getElementById('plan-body-'+phase);
  var chevEl = document.querySelector('#planphase-'+phase+' .plan-phase-chev');
  if(bodyEl) bodyEl.classList.toggle('collapsed', !G.plan.planPhaseOpen[phase]);
  if(chevEl) chevEl.classList.toggle('open', G.plan.planPhaseOpen[phase]);
}

function _renderPlanPhase(phase) {
  _initPlan();
  var entries = G.plan.entries.filter(function(e){ return e.phase===phase; });
  var container = document.getElementById('plan-body-'+phase);
  if(!container) return;

  var SS_COLORS = {A:'var(--purple)',B:'var(--teal)',C:'var(--gold)',D:'var(--green)'};
  var html = '';
  for(var i=0; i<entries.length; i++){
    var entry = entries[i];
    var gi = G.plan.entries.indexOf(entry); // global index
    var exDef = db.exercises.find(function(x){ return x.id===entry.exerciseId; });
    var name = exDef ? exDef.name : 'Unknown';
    var isCardio = exDef && exDef.type==='cardio';
    var ssCls = entry.ssGroup ? ' ss-'+entry.ssGroup : '';
    var summary = isCardio
      ? 'Cardio'
      : ((entry.sets||4)+'×'+(entry.targetReps||'—')+' @ '+(entry.startWeight||'—')+'lbs');

    // SS connector above if previous entry has same SS group
    if(i>0 && entries[i-1].ssGroup && entries[i-1].ssGroup===entry.ssGroup) {
      html += '<div class="plan-ss-connector plan-ss-conn-'+entry.ssGroup+'"></div>';
    }

    html += '<div class="plan-ex-card'+ssCls+'" id="plancard-'+gi+'">';
    // Card header
    html += '<div class="plan-ex-hdr" onclick="togglePlanCard('+gi+')">'+
      '<div style="display:flex;align-items:center;gap:6px;flex:1;min-width:0">'+
        (entry.ssGroup?'<span style="font-size:10px;font-weight:800;color:'+SS_COLORS[entry.ssGroup]+';background:rgba(255,255,255,0.06);padding:1px 6px;border-radius:5px;flex-shrink:0">SS '+entry.ssGroup+'</span>':'')+
        '<span class="plan-ex-name">'+name+'</span>'+
      '</div>'+
      '<span class="plan-ex-summary">'+summary+'</span>'+
      '<div class="reorder-btns" style="margin-left:4px" onclick="event.stopPropagation()">'+
        '<div class="reorder-btn" onclick="planMoveEx('+gi+',-1)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg></div>'+
        '<div class="reorder-btn" onclick="planMoveEx('+gi+',1)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></div>'+
      '</div>'+
      '<div class="btn-icon" style="width:28px;height:28px;flex-shrink:0;margin-left:2px" title="Move to phase" onclick="event.stopPropagation();planMoveExPhase('+gi+')" >'+
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>'+
      '</div>'+
      '<div class="btn-icon" style="width:28px;height:28px;flex-shrink:0;margin-left:2px" onclick="event.stopPropagation();planRemoveEx('+gi+')">'+
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'+
      '</div>'+
    '</div>';

    // Card body (expanded)
    if(entry.expanded !== false) {
      html += '<div class="plan-ex-body">';
      if(!isCardio) {
        // Sets / Starting Weight / Target Reps grid
        html += '<div class="plan-cfg-grid">'+
          '<div class="plan-cfg-cell"><div class="plan-cfg-lbl">Sets</div>'+
            '<input class="plan-cfg-inp" type="number" inputmode="numeric" min="1" max="20" placeholder="4" value="'+(entry.sets||'')+'"'+
              ' onchange="G.plan.entries['+gi+'].sets=parseInt(this.value)||4;_refreshPlanSummary('+gi+')" id="pe-sets-'+gi+'">'+
          '</div>'+
          '<div class="plan-cfg-cell"><div class="plan-cfg-lbl">Start wt (lbs)</div>'+
            '<input class="plan-cfg-inp" type="number" inputmode="decimal" placeholder="—" value="'+(entry.startWeight||'')+'"'+
              ' onchange="G.plan.entries['+gi+'].startWeight=this.value;_refreshPlanSummary('+gi+')" id="pe-wt-'+gi+'">'+
          '</div>'+
          '<div class="plan-cfg-cell"><div class="plan-cfg-lbl">Target reps</div>'+
            '<input class="plan-cfg-inp" type="number" inputmode="numeric" placeholder="—" value="'+(entry.targetReps||'')+'"'+
              ' onchange="G.plan.entries['+gi+'].targetReps=this.value;_refreshPlanSummary('+gi+')" id="pe-reps-'+gi+'">'+
          '</div>'+
        '</div>';
        // Rest timer presets
        var REST_OPTS = [30,60,90,120,180];
        html += '<div class="plan-rest-row">'+
          '<div class="plan-rest-lbl">Rest Timer</div>'+
          REST_OPTS.map(function(s){
            var sel = (entry.restSecs||90)===s;
            return '<div class="plan-rest-chip'+(sel?' sel':'')+'" onclick="setPlanRest('+gi+','+s+')">'+
              (s<60?s+'s':(s/60)+'m')+'</div>';
          }).join('')+
          '<input class="plan-rest-inp" type="number" inputmode="numeric" placeholder="sec" id="pe-rest-'+gi+'"'+
            ' value="'+(!REST_OPTS.includes(entry.restSecs||90)?entry.restSecs:'')+'"'+
            ' onchange="setPlanRest('+gi+',parseInt(this.value)||90)" title="Custom seconds">'+
        '</div>';
        // SS assignment
        html += '<div class="plan-ss-row">'+
          '<div class="plan-ss-lbl">Superset</div>'+
          '<div class="plan-ss-pills">'+
          ['A','B','C','D'].map(function(g){
            var on = entry.ssGroup===g;
            return '<div class="plan-ss-pill'+(on?' on-'+g:'')+'" onclick="setPlanSS('+gi+',\''+g+'\')">'+g+'</div>';
          }).join('')+
          (entry.ssGroup?'<div class="plan-ss-pill" style="width:auto;padding:0 8px;font-size:10px;color:var(--red);border-color:rgba(232,93,76,0.3)" onclick="setPlanSS('+gi+',null)">Clear</div>':'')+
          '</div>'+
        '</div>';
      } else {
        // Cardio: just duration target
        html += '<div class="plan-cfg-grid" style="grid-template-columns:1fr 1fr">'+
          '<div class="plan-cfg-cell"><div class="plan-cfg-lbl">Duration (min)</div>'+
            '<input class="plan-cfg-inp" type="number" inputmode="decimal" placeholder="—" value="'+(entry.targetReps||'')+'"'+
              ' onchange="G.plan.entries['+gi+'].targetReps=this.value" id="pe-reps-'+gi+'">'+
          '</div>'+
          '<div class="plan-cfg-cell"><div class="plan-cfg-lbl">Target Level</div>'+
            '<input class="plan-cfg-inp" type="number" inputmode="decimal" placeholder="—" value="'+(entry.startWeight||'')+'"'+
              ' onchange="G.plan.entries['+gi+'].startWeight=this.value" id="pe-wt-'+gi+'">'+
          '</div>'+
        '</div>';
      }
      html += '</div>'; // plan-ex-body
    }
    html += '</div>'; // plan-ex-card
  }

  if(!entries.length){
    html = '<div style="padding:6px 0 10px;color:var(--t3);font-size:11px;text-align:center">Empty — tap + Add</div>';
  }
  container.innerHTML = html;
  var isOpen = G.plan.planPhaseOpen[phase]!==false;
  container.classList.toggle('collapsed', !isOpen);
}

function _refreshPlanSummary(gi) {
  var entry = G.plan.entries[gi];
  if(!entry) return;
  var exDef = db.exercises.find(function(x){ return x.id===entry.exerciseId; });
  var isCardio = exDef && exDef.type==='cardio';
  var sum = isCardio ? 'Cardio'
    : ((entry.sets||4)+'×'+(entry.targetReps||'—')+' @ '+(entry.startWeight||'—')+'lbs');
  var el = document.querySelector('#plancard-'+gi+' .plan-ex-summary');
  if(el) el.textContent = sum;
}

function togglePlanCard(gi) {
  _initPlan();
  var entry = G.plan.entries[gi];
  if(!entry) return;
  entry.expanded = (entry.expanded===false) ? true : false;
  _renderPlanPhase(entry.phase);
}

function setPlanRest(gi, secs) {
  _initPlan();
  G.plan.entries[gi].restSecs = secs;
  var REST_OPTS = [30,60,90,120,180];
  // Update chip selection in-place
  var card = document.getElementById('plancard-'+gi);
  if(!card) return;
  card.querySelectorAll('.plan-rest-chip').forEach(function(c,idx){
    c.classList.toggle('sel', REST_OPTS[idx]===secs);
  });
  // Clear custom input if a preset was picked
  var customInp = document.getElementById('pe-rest-'+gi);
  if(customInp && REST_OPTS.includes(secs)) customInp.value = '';
}

function setPlanSS(gi, group) {
  _initPlan();
  G.plan.entries[gi].ssGroup = group||null;
  // Re-render only this phase to update SS connector lines
  _renderPlanPhase(G.plan.entries[gi].phase);
}

function planMoveEx(gi, dir) {
  _initPlan();
  var entries = G.plan.entries;
  var phase = entries[gi].phase;
  // Build candidate indices in same phase
  var cands = [];
  entries.forEach(function(e,i){ if(e.phase===phase) cands.push(i); });
  var pos = cands.indexOf(gi);
  var newPos = pos+dir;
  if(newPos<0||newPos>=cands.length) return;
  var newGi = cands[newPos];
  var tmp = entries[gi]; entries[gi]=entries[newGi]; entries[newGi]=tmp;
  _renderPlanPhase(phase);
}

function planRemoveEx(gi) {
  _initPlan();
  G.plan.entries.splice(gi,1);
  ['warmup','workout','cooldown'].forEach(_renderPlanPhase);
}

function planMoveExPhase(gi) {
  _initPlan();
  var entry = G.plan.entries[gi];
  if(!entry) return;
  var phases = ['warmup','workout','cooldown'];
  var cur = phases.indexOf(entry.phase||'workout');
  // Show a small picker instead of cycling blindly
  var phaseLabels = {warmup:'🔥 Warmup', workout:'💪 Workout', cooldown:'❄️ Cool Down'};
  openModal('Move to Phase',
    '<div style="font-size:13px;color:var(--t2);margin-bottom:14px">Move <strong style="color:var(--t1)">'+
      (db.exercises.find(function(e){return e.id===entry.exerciseId;})||{name:'Exercise'}).name+
    '</strong> to:</div>'+
    phases.map(function(ph){
      var isCur = ph===(entry.phase||'workout');
      return '<button class="btn '+(isCur?'btn-primary':'btn-ghost')+'" style="width:100%;margin-bottom:8px;'+(isCur?'':'opacity:0.8')+'" '+
        (isCur?'disabled':' onclick="confirmPlanMovePhase('+gi+',\''+ph+'\')">') +
        phaseLabels[ph]+(isCur?' (current)':'')+
      '</button>';
    }).join('')
  );
}

function confirmPlanMovePhase(gi, newPhase) {
  _initPlan();
  var oldPhase = G.plan.entries[gi].phase||'workout';
  G.plan.entries[gi].phase = newPhase;
  closeModal();
  // Re-render both affected phases
  _renderPlanPhase(oldPhase);
  _renderPlanPhase(newPhase);
  toast('✓ Moved to '+newPhase);
}

function planAddEx(phase) {
  G._planPickPhase = phase;
  G._planPickQueue = []; // array of exerciseIds queued for add
  var phaseBoost = (phase==='warmup'||phase==='cooldown') ? ['Stretch','Cardio','Stretching'] : [];

  function buildHTML(filter) {
    filter = (filter||'').toLowerCase();
    // Flat filtered list
    var all = db.exercises.filter(function(ex){
      if(!filter) return true;
      return ex.name.toLowerCase().indexOf(filter)>=0 ||
             ex.muscles.some(function(m){return m.toLowerCase().indexOf(filter)>=0;});
    });
    // Sort: boosted types first when no filter, otherwise alpha
    all.sort(function(a,b){
      if(!filter && phaseBoost.length) {
        var aBoost = a.muscles.some(function(m){return phaseBoost.indexOf(m)>=0;}) || phaseBoost.indexOf(a.type)>=0;
        var bBoost = b.muscles.some(function(m){return phaseBoost.indexOf(m)>=0;}) || phaseBoost.indexOf(b.type)>=0;
        if(aBoost&&!bBoost) return -1;
        if(!aBoost&&bBoost) return 1;
      }
      return a.name.localeCompare(b.name);
    });

    if(!all.length) return '<div style="color:var(--t3);padding:12px;text-align:center;font-size:13px">No matches</div>';

    // Group by primary muscle for display header only
    var groups = {};
    all.forEach(function(ex){
      var k = ex.muscles[0]||'Other';
      if(!groups[k]) groups[k]=[];
      groups[k].push(ex);
    });

    return Object.keys(groups).sort().map(function(muscle){
      var exs = groups[muscle];
      return '<div style="margin-bottom:4px">'+
        '<div style="font-size:10px;font-weight:800;color:var(--t3);letter-spacing:1px;text-transform:uppercase;padding:8px 4px 4px">'+muscle+'</div>'+
        exs.map(function(ex){
          var queued = G._planPickQueue.indexOf(ex.id)>=0;
          var alreadyIn = G.plan && G.plan.entries.some(function(e){return e.exerciseId===ex.id;});
          var typeIcon = ex.type==='stretch'?'🧘 ':ex.type==='cardio'?'🏃 ':'';
          return '<div id="pprow-'+ex.id+'" class="card-row" onclick="planQueueEx('+ex.id+')" style="border-radius:10px;margin-bottom:3px;background:'+(queued?'rgba(0,217,217,0.1)':'var(--bg2)')+';border:1.5px solid '+(queued?'var(--teal)':'var(--border1)')+';transition:all 0.15s">'+
            '<div class="card-body">'+
              '<div class="card-title">'+typeIcon+ex.name+(alreadyIn?' <span style="font-size:10px;color:var(--t3)">(in plan)</span>':'')+'</div>'+
              '<div class="card-sub">'+ex.muscles.join(', ')+'</div>'+
            '</div>'+
            (queued
              ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
              : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>'
            )+
          '</div>';
        }).join('')+
      '</div>';
    }).join('');
  }

  var phaseLabel = ' — '+phase.charAt(0).toUpperCase()+phase.slice(1);
  openModal('Add Exercise'+phaseLabel,
    '<div class="fg" style="margin-bottom:8px"><input class="finput" id="pp-srch" placeholder="🔍 Search exercises…" '+
      'oninput="_ppRebuild()" autocomplete="off" autocorrect="off" spellcheck="false"></div>'+
    '<div id="pp-pick" style="max-height:52vh;overflow-y:auto">'+buildHTML('')+'</div>'+
    '<div id="pp-add-bar" style="display:none;padding-top:10px;border-top:1px solid var(--border1);margin-top:8px">'+
      '<button class="btn btn-primary" style="width:100%" onclick="planConfirmQueue()">Add <span id="pp-add-count">0</span> Exercise(s)</button>'+
    '</div>'
  );
  G._ppBuilder = buildHTML;
}

function _ppRebuild() {
  var srch = document.getElementById('pp-srch');
  var pick = document.getElementById('pp-pick');
  if(pick && G._ppBuilder) pick.innerHTML = G._ppBuilder(srch?srch.value:'');
}

function planQueueEx(id) {
  var idx = G._planPickQueue.indexOf(id);
  if(idx>=0) {
    G._planPickQueue.splice(idx,1);
  } else {
    G._planPickQueue.push(id);
  }
  // Update this row in-place
  var row = document.getElementById('pprow-'+id);
  if(row) {
    var queued = G._planPickQueue.indexOf(id)>=0;
    row.style.background = queued ? 'rgba(0,217,217,0.1)' : 'var(--bg2)';
    row.style.borderColor = queued ? 'var(--teal)' : 'var(--border1)';
    var icon = row.querySelector('svg:last-child');
    if(icon) icon.setAttribute('stroke', queued?'var(--teal)':'var(--teal)');
    // Swap icon
    if(queued) {
      icon.outerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    } else {
      icon.outerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
    }
  }
  // Update add bar
  var bar = document.getElementById('pp-add-bar');
  var cnt = document.getElementById('pp-add-count');
  if(bar) bar.style.display = G._planPickQueue.length ? 'block' : 'none';
  if(cnt) cnt.textContent = G._planPickQueue.length;
}

function planConfirmQueue() {
  _initPlan();
  var phase = G._planPickPhase||'workout';
  G._planPickQueue.forEach(function(id){
    var prevW = getPrevWeight(id);
    G.plan.entries.push({
      id: Date.now()+Math.random(),
      phase: phase,
      exerciseId: id,
      sets: 4,
      startWeight: prevW||'',
      targetReps: '',
      restSecs: db.settings.defaultRestSecs||90,
      ssGroup: null,
      expanded: true
    });
  });
  var count = G._planPickQueue.length;
  G._planPickQueue = [];
  closeModal();
  _renderPlanPhase(phase);
  toast('✓ Added '+count+' exercise'+(count!==1?'s':'')+' to '+phase);
}

function planLoadPreset() {
  var presets = db.presets||[];
  if(!presets.length){toast('No presets saved yet');return;}
  var rows = presets.map(function(p){
    return '<div class="card-row" onclick="_applyPresetToPlan('+p.id+')" style="border-radius:10px;margin-bottom:4px;background:var(--bg2);border:1px solid var(--border1)">'+
      '<div class="card-body">'+
        '<div class="card-title">'+p.name+'</div>'+
        '<div class="card-sub">'+p.muscles.join(', ')+' · '+p.exercises.length+' exercises</div>'+
      '</div>'+
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>'+
    '</div>';
  }).join('');
  openModal('Load Preset',
    '<div style="font-size:12px;color:var(--t2);margin-bottom:12px">Loading a preset will replace the current plan.</div>'+rows
  );
}

function _applyPresetToPlan(presetId) {
  var p = db.presets.find(function(x){return x.id===presetId;});
  if(!p) return;
  G.plan = {
    name: p.name,
    day: new Date().getDay(),
    muscles: p.muscles.slice(),
    planPhaseOpen: {warmup:true, workout:true, cooldown:true},
    entries: p.exercises.map(function(pe){
      return {
        id: Date.now()+Math.random(),
        phase: pe.phase||'workout',
        exerciseId: pe.exerciseId,
        sets: pe.sets||4,
        startWeight: getPrevWeight(pe.exerciseId)||'',
        targetReps: pe.targetReps||'',
        restSecs: pe.restSecs||db.settings.defaultRestSecs||90,
        ssGroup: pe.ssGroup||null,
        expanded: true
      };
    })
  };
  closeModal();
  renderPlanner();
  toast('✓ Loaded: '+p.name);
}

function launchPlan() {
  _initPlan();
  if(!G.plan.entries.length){toast('Add at least one exercise');return;}
  var day = G.plan.day||new Date().getDay();
  var muscles = G.plan.muscles.length ? G.plan.muscles : _inferMuscles(G.plan.entries);
  var sess = {
    id: db.ids.session++,
    date: new Date().toISOString(),
    day: day,
    muscles: muscles,
    exercises: [],
    duration: 0,
    notes: ''
  };
  // Track first workout-phase exercise index for auto-expand
  var firstWorkoutIdx = -1;
  G.plan.entries.forEach(function(entry, planIdx){
    var exDef = db.exercises.find(function(e){return e.id===entry.exerciseId;});
    var isCardio = exDef && exDef.type==='cardio';
    var isStretch = exDef && exDef.type==='stretch';
    var phase = entry.phase||'workout';
    if(phase==='workout' && firstWorkoutIdx<0 && !isCardio) firstWorkoutIdx = sess.exercises.length;
    if(isCardio){
      var targetLevel = parseFloat(entry.startWeight)||0;
      sess.exercises.push({
        exerciseId: entry.exerciseId,
        phase: phase,
        cardioData: {level:targetLevel||1, durationSecs:0, done:false,
          targetDuration: parseFloat(entry.targetReps)||0},
        equipOverride: exDef ? [exDef.equipment[0]||''] : [],
        minimized: false
      });
    } else if(isStretch){
      // Stretch: start with 1 set, 30s hold; maxSets from plan
      var maxSets = parseInt(entry.sets)||1;
      var stretchLogMode = exDef.defaultLogMode || 'hold';
      sess.exercises.push({
        exerciseId: entry.exerciseId,
        phase: phase,
        sets: [{holdSecs:30, done:false}],
        maxSets: maxSets,
        logMode: stretchLogMode,
        equipOverride: exDef ? [exDef.equipment[0]||''] : [],
        minimized: false,
        notes: ''
      });
    } else {
      var numSets = parseInt(entry.sets)||4;
      var weight = String(entry.startWeight||'');
      var reps = String(entry.targetReps||'');
      var restSecs = entry.restSecs || db.settings.defaultRestSecs || 90;
      // Progressive reveal: start with 1 set, track max
      sess.exercises.push({
        exerciseId: entry.exerciseId,
        phase: phase,
        sets: [{weight:weight, reps:reps, targetReps:reps, done:false, warmup:false}],
        maxSets: numSets,
        logMode: exDef ? (exDef.defaultLogMode||'reps') : 'reps',
        ssGroup: entry.ssGroup||null,
        restSecs: restSecs,
        equipOverride: exDef ? [exDef.equipment[0]||''] : [],
        minimized: false,
        notes: ''
      });
    }
  });
  // Auto-expand first workout exercise, minimize others
  sess.exercises.forEach(function(ex, i){
    if((ex.phase||'workout')==='workout') ex.minimized = (i !== firstWorkoutIdx);
  });
  G.sess = sess;
  G.sessStart = Date.now();
  G.sessPaused = 0;
  G.phaseOpen = {warmup:true,workout:true,cooldown:true};
  clearInterval(G.timerID);
  G.timerID = setInterval(tickSessionTimer, 500);
  saveDB();
  _setLogState('active-session');
  renderSession();
  toast('🏋 Workout started!');
}

function _inferMuscles(entries) {
  var muscles = [];
  entries.forEach(function(e){
    var exDef = db.exercises.find(function(x){return x.id===e.exerciseId;});
    if(exDef) exDef.muscles.forEach(function(m){ if(muscles.indexOf(m)<0) muscles.push(m); });
  });
  return muscles.slice(0,4);
}

function savePlanAsPreset() {
  _initPlan();
  if(!G.plan.entries.length){toast('Add exercises first');return;}
  openModal('Save as Preset',
    '<div class="fg"><label class="flabel">Preset Name</label>'+
    '<input class="finput" id="spn-name" value="'+(G.plan.name||'')+'" placeholder="e.g. Push Day, Leg Day…"></div>'+
    '<button class="btn btn-primary" onclick="confirmSavePlanAsPreset()">Save Preset</button>'
  );
}

function confirmSavePlanAsPreset() {
  var nameEl = document.getElementById('spn-name');
  var name = nameEl ? nameEl.value.trim() : '';
  if(!name){toast('Enter a name');return;}
  var muscles = G.plan.muscles.length ? G.plan.muscles : _inferMuscles(G.plan.entries);
  var preset = {
    id: db.ids.preset++,
    builtin: false,
    name: name,
    muscles: muscles,
    exercises: G.plan.entries.map(function(e){
      return {exerciseId:e.exerciseId, phase:e.phase||'workout', sets:e.sets, targetReps:e.targetReps,
              startWeight:e.startWeight, restSecs:e.restSecs, ssGroup:e.ssGroup||null};
    })
  };
  db.presets.push(preset);
  G.plan.name = name;
  saveDB();
  closeModal();
  toast('✓ Saved as "'+name+'"');
}

function clearPlan() {
  if(!G.plan || !G.plan.entries.length) return;
  if(!confirm('Clear this workout plan?')) return;
  G.plan = null;
  renderPlanner();
}

// Legacy startNewSession → now just goes to planner
function startNewSession() { navTo('s-log'); }

function tickSessionTimer() {
  if(!G.sessStart) return;
  G.elapsed=Math.floor((Date.now()-G.sessStart-G.sessPaused)/1000);
  var el=document.getElementById('sess-elapsed');
  if(el) el.textContent=fmt(G.elapsed);
}

/* === ACTIVE SESSION === */
var CARDIO_FIELD_LABELS = {
  level:'Level', duration:'Duration (min)', calories:'Calories (kcal)',
  speed:'Speed (mph)', incline:'Incline (%)', distance:'Distance (mi)',
  rpm:'RPM', spm:'Stroke/min', strides:'Strides/min', rounds:'Rounds'
};
// Field step sizes for 1-decimal enforcement on numeric cardio inputs
var CARDIO_FIELD_STEPS = {
  level:0.5, duration:0.5, calories:1, speed:0.1,
  incline:0.5, distance:0.01, rpm:1, spm:1, strides:1, rounds:1
};

function renderSession() {
  var s=G.sess;
  if(!s){startNewSession();return;}
  var day=DAYS_L[s.day]||'';
  var mStr=s.muscles.length?s.muscles.join(', '):'General';
  document.getElementById('log-hdr').innerHTML =
    '<div class="sess-hdr">'+
    '<div class="sess-title">'+day+' — '+mStr+'</div>'+
    '<div class="sess-meta"><span>📅 '+new Date(s.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</span><span>🏋️ '+s.exercises.length+'</span></div>'+
    '<div class="sess-timer-row"><div><div class="sess-timer-val" id="sess-elapsed">'+fmt(G.elapsed)+'</div><div class="sess-timer-lbl">Session Duration</div></div>'+
    '<button class="btn btn-ghost btn-sm" onclick="startRestTimer('+(db.settings.defaultRestSecs||90)+')">⏱ Rest</button></div></div>';

  var ts=s.exercises.reduce(function(a,e){
    if(e.cardioData) return a+1;
    return a+(e.sets?e.sets.filter(function(x){return !x.warmup;}).length:0);
  },0);
  var ds=s.exercises.reduce(function(a,e){
    if(e.cardioData) return a+(e.cardioData.done?1:0);
    return a+(e.sets?e.sets.filter(function(x){return x.done&&!x.warmup;}).length:0);
  },0);
  document.getElementById('sess-prog').style.width=(ts?Math.round(ds/ts*100):0)+'%';

  var phases=['warmup','workout','cooldown'];
  phases.forEach(function(phase){
    var exs=s.exercises.filter(function(ex){return (ex.phase||'workout')===phase;});
    var container=document.getElementById('phase-body-'+phase);
    if(!container) return;
    var phaseEl=document.getElementById('phase-'+phase);
    if(phaseEl){
      var chev=phaseEl.querySelector('.phase-hdr-chev');
      var body=phaseEl.querySelector('.phase-body');
      var isOpen=G.phaseOpen[phase]!==false;
      if(chev) chev.classList.toggle('open',isOpen);
      if(body) body.classList.toggle('collapsed',!isOpen);
    }
    if(!exs.length){
      container.innerHTML='<div style="padding:2px 0 8px;color:var(--t3);font-size:11px;text-align:center">Empty — tap + Add</div>';
      return;
    }
    container.innerHTML=exs.map(function(ex){
      var ei=s.exercises.indexOf(ex);
      var exDef=db.exercises.find(function(x){return x.id===ex.exerciseId;});
      var isCardio=exDef&&exDef.type==='cardio';
      // Skip linked AB exercises — they render inline within their parent card
      if(ex.linkedTo !== undefined && ex.linkedTo !== null) return '';
      if(ex.minimized) return renderMiniCard(ex,ei,exDef);
      if(isCardio) return renderCardioExCard(ex,ei,exDef);
      if(exDef && exDef.type==='stretch') return renderStretchCard(ex,ei,exDef);
      return renderStrengthCard(ex,ei,exDef);
    }).join('');
    // SS connectors
    exs.forEach(function(ex,i){
      var ei=s.exercises.indexOf(ex);
      var nextEx=exs[i+1];
      if(nextEx&&ex.ssGroup&&nextEx.ssGroup===ex.ssGroup){
        var card=document.getElementById('exc-'+ei);
        if(card&&card.nextSibling){
          var ssColors={'A':'var(--purple)','B':'var(--teal)','C':'var(--gold)','D':'var(--blue)'};
          var div=document.createElement('div');
          div.className='ss-connector';
          div.innerHTML='<div class="ss-connector-line" style="background:'+(ssColors[ex.ssGroup]||'var(--purple)')+'"></div>';
          card.parentNode.insertBefore(div,card.nextSibling);
        }
      }
    });
  });
}

function togglePhase(phase){
  G.phaseOpen[phase]=G.phaseOpen[phase]===false?true:false;
  renderSession();
}

/* === STRETCH CARD === */
var G_stretchTimers = {}; // ei -> {id, start, running, holdSecs}

function renderStretchCard(ex, ei, exDef) {
  var name = exDef ? exDef.name : 'Stretch';
  var maxSets = ex.maxSets||1;
  var hint = prevHint(ex.exerciseId, G.sess.id);
  // Last note from history
  var lastNoteHint = _getLastExNote(ex.exerciseId);

  var setRows = (ex.sets||[]).map(function(set, si){
    var timer = G_stretchTimers[ei+'-'+si];
    var isRunning = timer && timer.running;
    var isPaused = timer && !timer.running && timer.elapsed > 0;
    var holdSecs = set.holdSecs || 30;
    var displaySecs = isRunning ? Math.floor((Date.now()-timer.start)/1000) : (timer ? timer.elapsed : 0);

    if(set.done) {
      return '<div class="stretch-set-row" id="sr-'+ei+'-'+si+'">'+
        '<div class="stretch-set-num done">'+( si+1)+'</div>'+
        '<div style="flex:1;font-size:14px;font-weight:800;color:var(--purple);text-align:center">✓ '+fmt(set.holdSecs||holdSecs)+'</div>'+
        '<div class="set-chk done" onclick="unlogStretchSet('+ei+','+si+')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--purple)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>'+
      '</div>';
    }

    var timerHTML;
    if(!isRunning && !isPaused) {
      timerHTML = '<div class="hold-countdown" id="hct-'+ei+'-'+si+'" onclick="startHoldTimer('+ei+','+si+')">'+fmt(holdSecs)+'</div>';
    } else if(isRunning) {
      timerHTML = '<div class="hold-countdown running" id="hct-'+ei+'-'+si+'" onclick="pauseHoldTimer('+ei+','+si+')">'+fmt(displaySecs)+'</div>';
    } else {
      timerHTML = '<div class="hold-countdown" id="hct-'+ei+'-'+si+'" style="color:var(--t2)" onclick="startHoldTimer('+ei+','+si+')">'+fmt(displaySecs)+'</div>';
    }

    return '<div class="stretch-set-row" id="sr-'+ei+'-'+si+'">'+
      '<div class="stretch-set-num">'+( si+1)+'</div>'+
      '<div class="hold-stepper">'+
        '<div class="hold-stepper-btn" ontouchstart="adjustHoldTime('+ei+','+si+',-5)" onclick="adjustHoldTime('+ei+','+si+',-5)">−</div>'+
        timerHTML+
        '<div class="hold-stepper-btn" ontouchstart="adjustHoldTime('+ei+','+si+',5)" onclick="adjustHoldTime('+ei+','+si+',5)">+</div>'+
      '</div>'+
      '<button class="btn-log-set" style="max-width:52px;font-size:11px" ontouchstart="logStretchSet('+ei+','+si+',event)" onclick="logStretchSet('+ei+','+si+',event)">'+
        '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Log'+
      '</button>'+
    '</div>';
  }).join('');

  var doneSets = (ex.sets||[]).filter(function(s){return s.done;}).length;
  var totalSets = (ex.sets||[]).length;
  var canAddMore = totalSets < maxSets || true; // always allow more

  return '<div class="stretch-card" id="exc-'+ei+'">'+
    '<div class="stretch-hdr">'+
      '<span style="font-size:18px">🧘</span>'+
      '<div style="flex:1"><div class="stretch-name" id="exname-'+ei+'">'+name+'</div>'+
        '<div style="font-size:11px;color:var(--t2);margin-top:1px" id="exmeta-'+ei+'">'+doneSets+'/'+totalSets+' sets done</div>'+
      '</div>'+
      '<div style="display:flex;gap:4px">'+
        '<div class="btn-icon" onclick="openExConfig('+ei+')" title="Settings"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>'+
        '<div class="btn-icon" onclick="addStretchSet('+ei+')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--purple)" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>'+
        '<div class="btn-icon" onclick="removeEx('+ei+')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>'+
      '</div>'+
    '</div>'+
    '<div class="stretch-body">'+
      (lastNoteHint?'<div class="ex-note-hint">📝 <span>'+lastNoteHint+'</span></div>':'')+

      setRows+
    '</div>'+
    renderExNoteSection(ex, ei)+
    '<div class="ex-done-row">'+
      '<button class="btn-done-ex" style="border-color:rgba(157,78,221,0.3);color:var(--purple);background:rgba(157,78,221,0.1)" onclick="finishExercise('+ei+')">'+
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'+
        'Done with Stretch'+
      '</button>'+
      '<button class="btn-collapse-ex" onclick="toggleMinimize('+ei+')" title="Collapse">'+
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>'+
      '</button>'+
    '</div>'+
  '</div>';
}

function startHoldTimer(ei, si) {
  var key = ei+'-'+si;
  var ex = G.sess && G.sess.exercises[ei];
  if(!ex) return;
  var holdSecs = (ex.sets[si]||{}).holdSecs || 30;
  var existing = G_stretchTimers[key];
  var elapsed = existing ? existing.elapsed : 0;
  if(existing && existing.id) clearInterval(existing.id);
  var startTime = Date.now() - elapsed*1000;
  var timer = {start:startTime, running:true, elapsed:elapsed, holdSecs:holdSecs, id:null};
  G_stretchTimers[key] = timer;
  timer.id = setInterval(function(){
    var e = Math.floor((Date.now()-startTime)/1000);
    timer.elapsed = e;
    var el = document.getElementById('hct-'+ei+'-'+si);
    if(el) el.textContent = fmt(e);
    // Auto-log when countdown reaches holdSecs
    if(e >= holdSecs) {
      clearInterval(timer.id);
      timer.running = false;
      playRestBeep();
      logStretchSet(ei, si, null);
    }
  }, 250);
  // Update display class
  var el = document.getElementById('hct-'+ei+'-'+si);
  if(el) el.className = 'hold-countdown running';
}

function pauseHoldTimer(ei, si) {
  var key = ei+'-'+si;
  var timer = G_stretchTimers[key];
  if(!timer || !timer.running) return;
  clearInterval(timer.id);
  timer.running = false;
  timer.elapsed = Math.floor((Date.now()-timer.start)/1000);
  var el = document.getElementById('hct-'+ei+'-'+si);
  if(el){ el.className='hold-countdown'; el.textContent=fmt(timer.elapsed); }
}

function adjustHoldTime(ei, si, delta) {
  if(!G.sess || !G.sess.exercises[ei]) return;
  var ex = G.sess.exercises[ei];
  if(!ex.sets[si]) return;
  var cur = ex.sets[si].holdSecs || 30;
  ex.sets[si].holdSecs = Math.max(5, cur+delta);
  // Update display
  var key = ei+'-'+si;
  var timer = G_stretchTimers[key];
  if(!timer || !timer.running) {
    var el = document.getElementById('hct-'+ei+'-'+si);
    if(el) el.textContent = fmt(ex.sets[si].holdSecs);
  }
}

function logStretchSet(ei, si, event) {
  if(event){ event.preventDefault(); event.stopPropagation(); }
  if(!G.sess || !G.sess.exercises[ei]) return;
  var ex = G.sess.exercises[ei];
  var set = ex.sets[si];
  if(!set || set.done) return;
  // Stop timer if running
  var key = ei+'-'+si;
  var timer = G_stretchTimers[key];
  var actualSecs = timer ? timer.elapsed : (set.holdSecs||30);
  if(timer && timer.id) { clearInterval(timer.id); timer.running=false; }
  set.holdSecs = actualSecs || set.holdSecs || 30;
  set.done = true;
  if(navigator.vibrate) navigator.vibrate([40,30,80]);
  // Check progressive reveal for stretches
  var maxSets = ex.maxSets || 1;
  var workingSets = ex.sets;
  var doneSets = workingSets.filter(function(s){return s.done;});
  if(doneSets.length === workingSets.length && workingSets.length < maxSets) {
    ex.sets.push({holdSecs:set.holdSecs, done:false});
  }
  renderSession();
  setTimeout(updateProgressBar, 50);
}

function unlogStretchSet(ei, si) {
  if(!G.sess || !G.sess.exercises[ei]) return;
  var ex = G.sess.exercises[ei];
  if(ex.sets[si]) { ex.sets[si].done = false; ex.sets[si].holdSecs = ex.sets[si].holdSecs||30; }
  delete G_stretchTimers[ei+'-'+si];
  renderSession();
}

function addStretchSet(ei) {
  if(!G.sess || !G.sess.exercises[ei]) return;
  var ex = G.sess.exercises[ei];
  var lastHold = ex.sets.length ? ex.sets[ex.sets.length-1].holdSecs||30 : 30;
  ex.sets.push({holdSecs:lastHold, done:false});
  if(!ex.maxSets || ex.sets.length > ex.maxSets) ex.maxSets = ex.sets.length;
  renderSession();
}

/* === PER-EXERCISE NOTES === */
function _getLastExNote(exId) {
  var sessions = db.sessions.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  for(var i=0;i<sessions.length;i++){
    var se = sessions[i].exercises.find(function(e){return e.exerciseId===exId && e.notes;});
    if(se && se.notes) return se.notes;
  }
  return null;
}

function renderExNoteSection(ex, ei) {
  var hasNote = !!(ex.notes && ex.notes.trim());
  return '<div class="ex-note-row">'+
    '<div class="ex-note-toggle" ontouchstart="" onclick="toggleExNote('+ei+')">'+
      (hasNote?'📝':'📝 '+(ex._noteOpen?'Hide note':'Add note'))+
    '</div>'+
    (hasNote||ex._noteOpen?
      '<textarea class="ex-note-field" id="exnote-'+ei+'" placeholder="Note for this session…" '+
        'oninput="G.sess.exercises['+ei+'].notes=this.value">'+( ex.notes||'')+'</textarea>'
    :'')+
  '</div>';
}

function toggleExNote(ei) {
  if(!G.sess || !G.sess.exercises[ei]) return;
  G.sess.exercises[ei]._noteOpen = !G.sess.exercises[ei]._noteOpen;
  // In-place DOM toggle to avoid keyboard dismissal
  var row = document.querySelector('#exc-'+ei+' .ex-note-row');
  if(!row) return;
  var ex = G.sess.exercises[ei];
  row.innerHTML = '<div class="ex-note-toggle" ontouchstart="" onclick="toggleExNote('+ei+')" style="display:inline-flex;align-items:center;gap:4px">'+
    (ex.notes||(ex._noteOpen)?'📝 '+(ex._noteOpen?'Hide note':'Add note'):'📝 Add note')+
  '</div>'+
  (ex._noteOpen||ex.notes?
    '<textarea class="ex-note-field" id="exnote-'+ei+'" placeholder="Note for this session…" '+
      'oninput="G.sess.exercises['+ei+'].notes=this.value" autofocus>'+( ex.notes||'')+'</textarea>'
  :'');
  var ta = document.getElementById('exnote-'+ei);
  if(ta && ex._noteOpen) { ta.focus(); }
}

function renderMiniCard(ex,ei,exDef){
  var name=exDef?exDef.name:'Unknown';
  var isDone=ex.completed||false;
  var isCardio=exDef&&exDef.type==='cardio';
  var ssLabel=ex.ssGroup?'<span class="ss-badge" style="font-size:9px;padding:1px 5px">SS '+ex.ssGroup+'</span>':'';

  // Meta line: equipment + position
  var selEquipId=(ex.equipOverride&&ex.equipOverride[0])||((exDef&&exDef.equipment&&exDef.equipment[0])||'');
  var posStr=ex.positionOverride?' · '+ex.positionOverride:'';
  var metaLine=(selEquipId?eqLabel(selEquipId):'')+posStr;

  // Summary count
  var summaryLine='';
  var setDotsHTML='';

  if(isCardio){
    var cd=ex.cardioData||{};
    var parts=[];
    if(cd.durationSecs)parts.push(fmt(cd.durationSecs));
    if(cd.level)parts.push('Lvl '+cd.level);
    if(cd.calories)parts.push(cd.calories+' cal');
    if(cd.speed)parts.push(cd.speed+' mph');
    summaryLine=parts.join(' · ')||'No data';
    // Cardio dot
    setDotsHTML='<div class="ex-mini-sets">'+
      '<div class="set-dot '+(isDone?'dot-done':'')+'" style="width:auto;padding:0 8px">'+summaryLine+'</div>'+
    '</div>';
  } else if(ex.sets&&ex.sets.length){
    var working=ex.sets.filter(function(s){return !s.warmup;});
    var warmups=ex.sets.filter(function(s){return s.warmup;});
    var doneCount=working.filter(function(s){return s.done;}).length;
    summaryLine=doneCount+'/'+working.length+' sets';
    if(warmups.length)summaryLine+=' +'+warmups.length+'wu';
    // Build set dots
    var dots=ex.sets.map(function(set,si){
      var cls='set-dot'+(set.warmup?' dot-wu':(set.done?' dot-done':''));
      var label=set.warmup?'W':(si+1-(ex.sets.slice(0,si).filter(function(s){return s.warmup;}).length));
      var title=set.warmup?'WU':'Set '+(si+1);
      if(set.weight&&set.reps) title+=' '+set.weight+'×'+set.reps;
      return '<div class="'+cls+'" title="'+title+'">'+label+'</div>';
    }).join('');
    setDotsHTML='<div class="ex-mini-sets">'+dots+'</div>';
  }

  // Icon: green check if done, minus if just collapsed
  var iconHTML=isDone
    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
    : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>';

  return '<div class="ex-card-mini'+(isDone?' completed':'')+'" id="exc-'+ei+'">'+
    '<div class="mini-rest" id="mini-rest-'+ei+'" style="margin:6px 12px 0">'+
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'+
      'Rest <span class="mini-rest-time">0:00</span>'+
      '<span style="margin-left:auto;cursor:pointer;color:var(--t3);font-size:11px" onclick="skipRest()">Skip ›</span>'+
    '</div>'+
    '<div class="ex-card-mini-hdr" onclick="toggleMinimize('+ei+')">'+
      '<div class="ex-mini-icon'+(isDone?' done-icon':'')+'">'+iconHTML+'</div>'+
      '<div style="flex:1;min-width:0">'+
        '<div class="ex-mini-name">'+name+' '+ssLabel+'</div>'+
        '<div style="font-size:11px;color:var(--t3);margin-top:1px">'+metaLine+'</div>'+
      '</div>'+
      '<div class="ex-mini-meta">'+summaryLine+'</div>'+
      '<svg class="ex-mini-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>'+
    '</div>'+
    setDotsHTML+
  '</div>';
}

function toggleMinimize(ei){
  if(!G.sess||!G.sess.exercises[ei])return;
  G.sess.exercises[ei].minimized=!G.sess.exercises[ei].minimized;
  renderSession();
}

function finishExercise(ei){
  if(!G.sess||!G.sess.exercises[ei])return;
  G.sess.exercises[ei].completed=true;
  G.sess.exercises[ei].minimized=true;
  renderSession();
}

function renderStrengthCard(ex,ei,exDef){
  var exName=exDef?exDef.name:'Unknown';
  var ssLabel=ex.ssGroup?'<span class="ss-badge">SS '+ex.ssGroup+'</span>':'';
  var selEquipId=(ex.equipOverride&&ex.equipOverride[0])||((exDef&&exDef.equipment&&exDef.equipment[0])||'');
  var posStr=ex.positionOverride?' — '+ex.positionOverride:'';
  var metaStr=(selEquipId?eqLabel(selEquipId)+' '+eqIcon(selEquipId):'')+posStr;
  var hint=prevHint(ex.exerciseId,G.sess.id);
  var lastNoteHint = _getLastExNote(ex.exerciseId);
  // Determine log mode: hold or reps
  var logMode = ex.logMode || (exDef && exDef.defaultLogMode) || (exDef && exDef.type==='stretch' ? 'hold' : 'reps');

  var setRows=(ex.sets||[]).map(function(set,si){
    var isWarmup=set.warmup||false;
    if(set.done) {
      var doneLabel = logMode==='hold'
        ? fmt(set.holdSecs||30)
        : ((set.weight?set.weight+' lbs':'')+' × '+(set.reps||''));
      return '<div class="set-row'+(isWarmup?' warmup':'')+'" id="sr-'+ei+'-'+si+'" style="opacity:0.6">'+
        '<div class="set-num done">'+( si+1)+'</div>'+
        '<div style="flex:1;font-size:13px;font-weight:700;color:var(--green);text-align:center">'+
          doneLabel+(isWarmup?' <span class="warmup-badge">WU</span>':'')+
        '</div>'+
        '<div class="set-chk done" onclick="toggleSet('+ei+','+si+')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>'+

/* === EXERCISE CONFIG MODAL (⚙️ in session card) === */
function openExConfig(ei) {
  if(!G.sess || !G.sess.exercises[ei]) return;
  var ex = G.sess.exercises[ei];
  var exDef = db.exercises.find(function(e){ return e.id===ex.exerciseId; });
  var name = exDef ? exDef.name : 'Exercise';
  var isStretch = exDef && exDef.type==='stretch';
  var logMode = ex.logMode || (exDef&&exDef.defaultLogMode) || (isStretch?'hold':'reps');

  // Equipment section
  var selEquipId = (ex.equipOverride&&ex.equipOverride[0]) || (exDef&&exDef.equipment&&exDef.equipment[0]) || '';
  var PRIMARY_EQUIP=['barbell','dumbbell','cable','machine','bodyweight','smith'];
  var allEquip = exDef ? exDef.equipment : [];
  // Show primary + any in the exercise def
  var equipIds = PRIMARY_EQUIP.filter(function(id){ return allEquip.indexOf(id)>=0||id===selEquipId; });
  // Add any non-primary from the exercise def
  allEquip.forEach(function(id){ if(equipIds.indexOf(id)<0) equipIds.push(id); });
  var eChips = equipIds.map(function(eId){
    var eq = EQUIP_LIST.find(function(x){return x.id===eId;});
    if(!eq) return '';
    var sel = selEquipId===eId;
    return '<div class="equip-primary-chip'+(sel?' sel':'')+'" onclick="cfgSetEquip('+ei+',\''+eId+'\',this)" data-id="'+eId+'">'+eq.icon+' '+eq.label+'</div>';
  }).join('');
  // Add "More" for anything not shown
  var moreBtn = '<div class="equip-more-btn" onclick="cfgMoreEquip('+ei+')">More ›</div>';

  // Position section
  var posChips = '';
  if(exDef && exDef.positions && exDef.positions.length) {
    posChips = '<div class="fg"><label class="flabel">Position / Angle</label><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">'+
      exDef.positions.map(function(p){
        var sel = ex.positionOverride===p;
        return '<div class="pos-chip'+(sel?' sel':'')+'" onclick="cfgSetPosition('+ei+',\''+p+'\',this)">'+p+'</div>';
      }).join('')+
      '<div class="pos-chip" onclick="cfgSetPosition('+ei+',null,null)" style="color:var(--t3)">Clear</div>'+
    '</div></div>';
  }

  // Rest timer
  var REST_OPTS=[30,60,90,120,180];
  var curRest = ex.restSecs || db.settings.defaultRestSecs || 90;
  var restChips = REST_OPTS.map(function(s){
    return '<div class="plan-rest-chip'+(curRest===s?' sel':'')+'" onclick="cfgSetRest('+ei+','+s+',this)">'+(s<60?s+'s':(s/60)+'m')+'</div>';
  }).join('');

  openModal('⚙️ '+name,
    '<div class="fg"><label class="flabel">Equipment</label>'+
    '<div class="equip-primary" id="cfg-equip-'+ei+'" style="margin-top:4px">'+eChips+moreBtn+'</div></div>'+
    posChips+
    '<div class="fg"><label class="flabel">Logging Mode</label>'+
    '<div class="log-mode-toggle" style="margin-top:4px">'+
      '<div class="log-mode-opt hold'+(logMode==='hold'?' active':'')+'" id="cfg-mode-hold-'+ei+'" ontouchstart="" onclick="cfgSetLogMode('+ei+',\'hold\')">⏱ Hold Time</div>'+
      '<div class="log-mode-opt reps'+(logMode==='reps'?' active':'')+'" id="cfg-mode-reps-'+ei+'" ontouchstart="" onclick="cfgSetLogMode('+ei+',\'reps\')">⟳ Reps</div>'+
    '</div></div>'+
    '<div class="fg"><label class="flabel">Rest Timer</label>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px" id="cfg-rest-'+ei+'">'+restChips+'</div></div>'
  );
}

/* Weight stepper */
function adjustWeight(ei, si, delta) {
  if(!G.sess) return;
  var set=G.sess.exercises[ei].sets[si];
  var cur=parseFloat(set.weight)||0;
  var newVal=Math.max(0,cur+delta);
  set.weight=newVal%1===0?String(newVal):newVal.toFixed(1);
  // Update input directly without full re-render for smoothness
  var inputs=document.querySelectorAll('#exc-'+ei+' .w-stepper-inp');
  if(inputs[si]) inputs[si].value=set.weight;
}

/* Superset group assignment */
function setSsGroup(ei, group) {
  if(!G.sess) return;
  G.sess.exercises[ei].ssGroup=group||null;
  renderSession();
}

/* Equipment override toggle per exercise card */
function toggleExEquip(ei, equipId) {
  if(!G.sess) return;
  var ex=G.sess.exercises[ei];
  var exDef=db.exercises.find(function(x){return x.id===ex.exerciseId;});
  // Start from current override or default
  var cur=ex.equipOverride?ex.equipOverride.slice():(exDef?exDef.equipment.slice():[]);
  var idx=cur.indexOf(equipId);
  if(idx>=0) cur.splice(idx,1); else cur.push(equipId);
  ex.equipOverride=cur;
  renderSession();
}

function renderCardioExCard(ex, ei, exDef) {
  var cd = ex.cardioData || {};
  var fields = exDef.cardioFields || ['duration','level','calories'];
  var levelMax = exDef.levelMax || 0;
  var hint = prevHint(ex.exerciseId, G.sess.id);

  // Determine timer state for this exercise
  var isActive = (G.cardioTimerEi === ei);
  var isPaused = isActive && G.cardioTimerPaused;
  var isRunning = isActive && !G.cardioTimerPaused;
  var storedSecs = cd.durationSecs || 0;
  var displaySecs = isActive
    ? Math.floor((Date.now() - G.cardioTimerStart) / 1000)
    : storedSecs;

  var timerBtns;
  if (!isActive && storedSecs === 0) {
    // Not started yet
    timerBtns = '<button class="btn btn-ghost btn-sm" onclick="startCardioTimer('+ei+')">▶ Start</button>';
  } else if (isRunning) {
    // Running — show Pause and Stop
    timerBtns =
      '<button class="btn btn-ghost btn-sm" onclick="pauseCardioTimer('+ei+')">⏸ Pause</button>'+
      '<button class="btn btn-ghost btn-sm" style="color:var(--red);border-color:rgba(232,93,76,0.3)" onclick="stopCardioTimer('+ei+')">⏹ Stop</button>';
  } else if (isPaused) {
    // Paused — show Resume and Stop
    timerBtns =
      '<button class="btn btn-ghost btn-sm" style="color:var(--teal);border-color:rgba(0,217,217,0.3)" onclick="resumeCardioTimer('+ei+')">▶ Resume</button>'+
      '<button class="btn btn-ghost btn-sm" style="color:var(--red);border-color:rgba(232,93,76,0.3)" onclick="stopCardioTimer('+ei+')">⏹ End</button>';
  } else {
    // Stopped / has recorded time — allow restart or clear
    timerBtns =
      '<button class="btn btn-ghost btn-sm" onclick="startCardioTimer('+ei+')">▶ Restart</button>'+
      '<button class="btn btn-ghost btn-sm" style="color:var(--t3)" onclick="clearCardioTimer('+ei+')">✕ Clear</button>';
  }

  var targetSecs = (cd.targetDuration||0)*60;
  var timerSection =
    '<div class="cardio-live-timer">' +
      '<div>' +
        '<div class="cardio-live-lbl">'+(isRunning?'LIVE · ':(isPaused?'PAUSED · ':(storedSecs?'LOGGED · ':''))+'DURATION'+(targetSecs?(' — target '+fmt(targetSecs)):''))+'</div>' +
        '<div class="cardio-live-time" id="clt-'+ei+'" style="color:'+(isPaused?'var(--t2)':isRunning?'var(--teal)':'var(--t1)')+'">'+fmt(displaySecs)+'</div>' +
      '</div>' +
      '<div style="display:flex;gap:6px;align-items:center">'+timerBtns+
        '<button id="csave-'+ei+'" class="btn btn-ghost btn-sm" style="display:'+(isRunning&&targetSecs&&displaySecs>=targetSecs?'flex':'none')+';color:var(--green);border-color:rgba(61,220,132,0.4)" onclick="stopCardioTimer('+ei+')">✓ Save &amp; Stop</button>'+
        '<div class="btn-icon" onclick="removeEx('+ei+')" style="width:28px;height:28px">' +
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
        '</div>' +
      '</div>' +
    '</div>';
  timerSection +=
    // Manual override row — always visible, pre-fills from stored value
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'+
      '<div style="font-size:11px;font-weight:700;color:var(--t3);letter-spacing:0.8px;text-transform:uppercase;white-space:nowrap">Manual Override</div>'+
      '<input class="finput" type="number" inputmode="decimal" placeholder="mins" style="flex:1;padding:7px 10px;font-size:13px"'+
        ' value="'+(cd.duration||'')+'"'+
        ' oninput="setCardioField('+ei+',\'duration\',parseFloat(this.value)||0);setCardioField('+ei+',\'durationSecs\',Math.round((parseFloat(this.value)||0)*60));updateCardioTimerDisplay('+ei+')">'+
    '</div>';

  // Level as numeric input with ± stepper — 0.5 increments, 1 decimal
  var levelSection = (levelMax > 0)
    ? '<div class="cardio-field" style="margin-bottom:10px">' +
        '<div class="cardio-field-lbl">LEVEL (1–'+levelMax+')</div>' +
        '<div style="display:flex;align-items:center;gap:6px">'+
          '<div class="w-stepper-btn" style="width:28px;height:28px;border-radius:7px;background:var(--bg3);border:1px solid var(--border2);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--teal)" '+
            'ontouchstart="adjustCardioLevel('+ei+',-0.5)" onclick="adjustCardioLevel('+ei+',-0.5)">−</div>'+
          '<input class="set-inp" type="number" inputmode="decimal" step="0.5" min="0" max="'+levelMax+'" placeholder="Level" '+
            'value="'+(cd.level||'')+'" id="clv-'+ei+'" '+
            'oninput="setCardioField('+ei+',\'level\',parseFloat(this.value)||0)" '+
            'style="flex:1;font-size:16px;font-weight:800;color:var(--teal);text-align:center">'+
          '<div class="w-stepper-btn" style="width:28px;height:28px;border-radius:7px;background:var(--bg3);border:1px solid var(--border2);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--teal)" '+
            'ontouchstart="adjustCardioLevel('+ei+',0.5)" onclick="adjustCardioLevel('+ei+',0.5)">+</div>'+
        '</div>'+
      '</div>'
    : '';

  var otherFields = fields.filter(function(f){return f!=='level'&&f!=='duration';}).map(function(f){
    var lbl = CARDIO_FIELD_LABELS[f]||f;
    var step = CARDIO_FIELD_STEPS[f]||0.1;
    return '<div class="cardio-field">' +
      '<div class="cardio-field-lbl">'+lbl.toUpperCase()+'</div>' +
      '<input class="set-inp" type="number" inputmode="decimal" step="'+step+'" placeholder="—" value="'+(cd[f]||'')+'" ' +
        'oninput="setCardioField('+ei+',\''+f+'\',this.value)" style="background:transparent;border:none;padding:0;font-size:15px;font-weight:700;color:var(--t1);width:100%;text-align:left">' +
    '</div>';
  });
  var fieldsGrid = otherFields.length ? '<div class="cardio-fields">'+otherFields.join('')+'</div>' : '';

  return '<div class="cardio-log-card" id="exc-'+ei+'">' +
    '<div class="cardio-log-hdr"><div style="flex:1"><div class="cardio-log-name">🏃 '+exDef.name+'</div></div>'+
    '<div class="btn-icon" onclick="removeEx('+ei+')" style="width:28px;height:28px">'+
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'+
    '</div></div>' +

      (hint?'<div class="ex-hint" style="margin-bottom:10px">↑ Last: '+hint+'</div>':'') +
      timerSection + levelSection + fieldsGrid +

    '<div class="ex-done-row">'+
      '<button class="btn-done-ex" onclick="finishExercise('+ei+')">'+
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'+
        'Done with Cardio'+
      '</button>'+
      '<button class="btn-collapse-ex" onclick="toggleMinimize('+ei+')" title="Collapse without finishing">'+
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>'+
      '</button>'+
    '</div>'+
  '</div>';
}

/* Cardio timer controls — pause/resume/stop */
function startCardioTimer(ei) {
  clearInterval(G.cardioTimerID);
  G.cardioTimerEi = ei;
  G.cardioTimerStart = Date.now() - ((G.sess.exercises[ei].cardioData||{}).durationSecs||0)*1000;
  G.cardioTimerPaused = false;
  G._cardioAlerted = false; // reset target alert
  // Auto-start warmup phase timer when a warmup cardio exercise starts
  var ex = G.sess ? G.sess.exercises[ei] : null;
  if(ex && (ex.phase||'workout')==='warmup') autoStartPhaseTimer('warmup');
  if(ex && (ex.phase||'workout')==='cooldown') autoStartPhaseTimer('cooldown');
  G.cardioTimerID = setInterval(function(){
    if(G.cardioTimerPaused) return;
    var elapsed = Math.floor((Date.now()-G.cardioTimerStart)/1000);
    var el = document.getElementById('clt-'+ei);
    if(el) el.textContent = fmt(elapsed);
    // Check target duration alert
    var cex = G.sess && G.sess.exercises[ei];
    var targetSecs = cex && cex.cardioData && cex.cardioData.targetDuration ? Math.round(cex.cardioData.targetDuration*60) : 0;
    if(targetSecs && elapsed >= targetSecs && !G._cardioAlerted) {
      G._cardioAlerted = true;
      playRestBeep();
      // Show Save & Stop button prominently
      var stopEl = document.getElementById('csave-'+ei);
      if(stopEl){ stopEl.style.display='flex'; stopEl.style.background='rgba(61,220,132,0.2)'; stopEl.style.color='var(--green)'; }
      toast('🎯 Target duration reached! Tap Save & Stop to finish.');
    }
  }, 500);
  renderSession();
}

function adjustCardioLevel(ei, delta) {
  if(!G.sess||!G.sess.exercises[ei]) return;
  var cd=G.sess.exercises[ei].cardioData||(G.sess.exercises[ei].cardioData={});
  var cur=parseFloat(cd.level)||0;
  var exDef=db.exercises.find(function(e){return e.id===G.sess.exercises[ei].exerciseId;});
  var max=exDef?exDef.levelMax:25;
  var newVal=Math.min(max,Math.max(0,Math.round((cur+delta)*10)/10));
  cd.level=newVal;
  var el=document.getElementById('clv-'+ei);
  if(el) el.value=newVal;
}

function pauseCardioTimer(ei) {
  if(G.cardioTimerEi !== ei) return;
  G.cardioTimerPaused = true;
  // Save elapsed so far
  var secs = Math.floor((Date.now()-G.cardioTimerStart)/1000);
  if(G.sess.exercises[ei]) {
    if(!G.sess.exercises[ei].cardioData) G.sess.exercises[ei].cardioData={};
    G.sess.exercises[ei].cardioData.durationSecs = secs;
  }
  renderSession();
}

function resumeCardioTimer(ei) {
  if(G.cardioTimerEi !== ei) return;
  // Re-anchor start time so elapsed continues from saved value
  var saved = (G.sess.exercises[ei].cardioData||{}).durationSecs||0;
  G.cardioTimerStart = Date.now() - saved*1000;
  G.cardioTimerPaused = false;
  renderSession();
}

function stopCardioTimer(ei) {
  var secs = G.cardioTimerEi===ei ? Math.floor((Date.now()-G.cardioTimerStart)/1000) : ((G.sess.exercises[ei].cardioData||{}).durationSecs||0);
  clearInterval(G.cardioTimerID);
  G.cardioTimerEi = -1;
  G.cardioTimerStart = 0;
  G.cardioTimerPaused = false;
  if(G.sess && G.sess.exercises[ei]) {
    if(!G.sess.exercises[ei].cardioData) G.sess.exercises[ei].cardioData={};
    G.sess.exercises[ei].cardioData.durationSecs = secs;
    G.sess.exercises[ei].cardioData.duration = Math.round(secs/60*10)/10;
    G.sess.exercises[ei].cardioData.done = true;
  }
  toast('✓ Cardio logged: '+fmt(secs));
  // Auto-finish and collapse the exercise
  finishExercise(ei);
  // Advance focus to next non-completed exercise
  setTimeout(function(){
    if(!G.sess) return;
    for(var i=ei+1; i<G.sess.exercises.length; i++){
      var next = G.sess.exercises[i];
      if(!next.completed && !next.minimized && next.linkedTo===undefined){
        var wtEl = document.getElementById('wt-'+i+'-0');
        var rpEl = document.getElementById('reps-'+i+'-0');
        var target = (wtEl && wtEl.value) ? rpEl : wtEl;
        if(target){ target.scrollIntoView({block:'center',behavior:'smooth'}); target.focus(); }
        return;
      }
    }
  }, 200);
}

function clearCardioTimer(ei) {
  clearInterval(G.cardioTimerID);
  if(G.cardioTimerEi===ei){ G.cardioTimerEi=-1; G.cardioTimerStart=0; G.cardioTimerPaused=false; }
  if(G.sess && G.sess.exercises[ei] && G.sess.exercises[ei].cardioData) {
    G.sess.exercises[ei].cardioData.durationSecs=0;
    G.sess.exercises[ei].cardioData.duration=0;
    G.sess.exercises[ei].cardioData.done=false;
  }
  renderSession();
}

function setCardioField(ei, field, val) {
  if (!G.sess || !G.sess.exercises[ei]) return;
  if (!G.sess.exercises[ei].cardioData) G.sess.exercises[ei].cardioData = {};
  G.sess.exercises[ei].cardioData[field] = val;
}

function updateCardioTimerDisplay(ei) {
  // Update the live timer display without full re-render
  var cd=(G.sess&&G.sess.exercises[ei]&&G.sess.exercises[ei].cardioData)||{};
  var el=document.getElementById('clt-'+ei);
  if(el&&G.cardioTimerEi!==ei) el.textContent=fmt(cd.durationSecs||0);
}

function toggleCardioDone(ei) {
  if (!G.sess || !G.sess.exercises[ei]) return;
  if (!G.sess.exercises[ei].cardioData) G.sess.exercises[ei].cardioData = {};
  G.sess.exercises[ei].cardioData.done = !G.sess.exercises[ei].cardioData.done;
  renderSession();
}

function prevHint(exId, sessId) {
  var exDef = db.exercises.find(function(e){return e.id===exId;});
  var isCardio = exDef && exDef.type==='cardio';
  var isStretch = exDef && exDef.type==='stretch';
  var prev = db.sessions.filter(function(s){return s.id!==sessId && s.exercises.some(function(e){return e.exerciseId===exId;});})
    .sort(function(a,b){return new Date(b.date)-new Date(a.date);})[0];
  if (!prev) return null;
  var ex=prev.exercises.find(function(e){return e.exerciseId===exId;});
  if (!ex) return null;
  if (isStretch) {
    var doneSets=ex.sets?ex.sets.filter(function(s){return s.done;}):[];
    if(!doneSets.length) return null;
    return doneSets.length+'×'+fmt(doneSets[0].holdSecs||30);
  }
  if (isCardio) {
    var cd = ex.cardioData||{};
    var parts=[];
    if (cd.durationSecs) parts.push(fmt(cd.durationSecs));
    else if (cd.duration) parts.push(cd.duration+' min');
    if (cd.level) parts.push('Lvl '+cd.level);
    if (cd.calories) parts.push(cd.calories+' cal');
    if (cd.speed) parts.push(cd.speed+' mph');
    return parts.length ? parts.join(' · ') : null;
  }
  var done=ex.sets?ex.sets.filter(function(s){return s.done&&s.weight&&s.reps;}):[]; 
  if (!done.length) return null;
  var last=done[done.length-1];
  return last.weight+'lbs × '+last.reps+' reps ('+done.length+' set'+(done.length!==1?'s':'')+')';
}

/* Get last used weight for an exercise from history or current session */
function getPrevWeight(exId) {
  // First check current session for any already-entered weight
  if(G.sess) {
    var cur=G.sess.exercises.find(function(e){return e.exerciseId===exId;});
    if(cur&&cur.sets) {
      var lastW=cur.sets.slice().reverse().find(function(s){return s.weight&&!s.warmup;});
      if(lastW) return lastW.weight;
    }
  }
  // Fall back to last saved session
  var prev=db.sessions.filter(function(s){
    return s.exercises.some(function(e){return e.exerciseId===exId;});
  }).sort(function(a,b){return new Date(b.date)-new Date(a.date);})[0];
  if(!prev) return '';
  var ex=prev.exercises.find(function(e){return e.exerciseId===exId;});
  if(!ex||!ex.sets) return '';
  var done=ex.sets.filter(function(s){return s.done&&s.weight&&!s.warmup;});
  return done.length ? done[done.length-1].weight : '';
}

function addSet(ei) {
  if(!G.sess) return;
  var ex=G.sess.exercises[ei];
  // Carry weight and reps from last working set
  var lastWork=ex.sets.slice().reverse().find(function(s){return !s.warmup;})||{};
  ex.sets.push({weight:lastWork.weight||'',reps:lastWork.reps||'',targetReps:lastWork.targetReps||'',done:false,warmup:false});
  // Update maxSets if we're going beyond it
  if(!ex.maxSets || ex.sets.filter(function(s){return !s.warmup;}).length > ex.maxSets) {
    ex.maxSets = ex.sets.filter(function(s){return !s.warmup;}).length;
  }
  renderSession();
  setTimeout(function(){
    var si = ex.sets.length - 1;
    var inp = document.getElementById('wt-'+ei+'-'+si);
    if(!inp) { // try reps if weight pre-filled
      inp = document.getElementById('reps-'+ei+'-'+si);
    }
    if(inp){inp.scrollIntoView({block:'center',behavior:'smooth'});inp.focus();inp.select();}
  },40);
}

// Progressive reveal: after a set is logged, check if we should reveal the next one
function _revealNextSet(ei) {
  if(!G.sess) return;
  var ex = G.sess.exercises[ei];
  if(!ex || !ex.sets) return;
  var maxSets = ex.maxSets || 4;
  var workingSets = ex.sets.filter(function(s){return !s.warmup;});
  var doneSets = workingSets.filter(function(s){return s.done;});
  // Only reveal if all current working sets are done and we haven't hit max
  if(doneSets.length === workingSets.length && workingSets.length < maxSets) {
    var lastWork = workingSets[workingSets.length-1] || {};
    ex.sets.push({
      weight: lastWork.weight||'',
      reps: lastWork.reps||'',
      targetReps: lastWork.targetReps||'',
      done: false,
      warmup: false
    });
    // DOM-only append to avoid keyboard dismissal — we'll just re-render the set rows section
    // Use renderSession only if keyboard is not active
    renderSession();
    setTimeout(function(){
      var si = ex.sets.length - 1;
      var wtEl = document.getElementById('wt-'+ei+'-'+si);
      var rpEl = document.getElementById('reps-'+ei+'-'+si);
      var target = (wtEl && wtEl.value && wtEl.value.trim()) ? rpEl : wtEl;
      if(target){target.scrollIntoView({block:'center',behavior:'smooth'});target.focus();target.select();}
    }, 100);
  }
}
function addWarmupSet(ei) {
  if(!G.sess) return;
  var ex=G.sess.exercises[ei];
  // Insert warmup before first working set
  var firstWorkIdx=ex.sets.findIndex(function(s){return !s.warmup;});
  var wu={weight:'',reps:'',done:false,warmup:true};
  if(firstWorkIdx>=0) ex.sets.splice(firstWorkIdx,0,wu);
  else ex.sets.unshift(wu);
  renderSession();
}
function setField(ei,si,f,v) {
  if(!G.sess) return;
  G.sess.exercises[ei].sets[si][f]=v;
  // Weight cascade is handled in onWeightBlur — not here — so typing doesn't flicker
}

// Called when weight input loses focus — cascade to next undone working sets, then move to reps
function onWeightBlur(ei,si) {
  if(!G.sess) return;
  var sets=G.sess.exercises[ei].sets;
  var prevVal = sets[si].weight; // value before this edit (stored from last oninput)
  var inputEl = document.getElementById('wt-'+ei+'-'+si);
  var newVal = inputEl ? inputEl.value.trim() : prevVal;
  sets[si].weight = newVal;
  if(newVal) {
    // Cascade to subsequent undone working sets that are either:
    //   (a) empty, OR
    //   (b) had the same value as the set BEFORE this edit (i.e. were previously cascaded from this set)
    for(var i=si+1;i<sets.length;i++){
      if(!sets[i].warmup && !sets[i].done) {
        var existingW = sets[i].weight||'';
        // Cascade if empty or if it matches the old value (meaning it was cascade-filled before)
        if(!existingW || existingW===prevVal || existingW===newVal) {
          sets[i].weight=newVal;
          var inp=document.getElementById('wt-'+ei+'-'+i);
          if(inp) inp.value=newVal;
        }
      }
    }
    // Advance focus to reps on same set
    var r=document.getElementById('reps-'+ei+'-'+si);
    if(r){ r.focus(); r.select(); }
  }
}

function autoCompleteSet(ei,si) {
  if(!G.sess) return;
  var set=G.sess.exercises[ei].sets[si];
  if(set.done) return; // already logged
  // Read live DOM values
  var wtEl=document.getElementById('wt-'+ei+'-'+si);
  var rpEl=document.getElementById('reps-'+ei+'-'+si);
  if(wtEl) set.weight=wtEl.value;
  if(rpEl) set.reps=rpEl.value;
  if(!set.reps || !set.weight) return;
  set.done=true;
  // Cascade weight to next empty working sets (DOM-only, no re-render)
  var sets=G.sess.exercises[ei].sets;
  for(var i=si+1;i<sets.length;i++){
    if(!sets[i].warmup&&!sets[i].done&&(!sets[i].weight||sets[i].weight==='')){
      sets[i].weight=set.weight;
      var nInp=document.getElementById('wt-'+ei+'-'+i);
      if(nInp) nInp.value=set.weight;
    }
  }
  if(!set.warmup) startRestTimer(db.settings.defaultRestSecs||90, ei);

  // In-place DOM update to mark set done (avoids keyboard dismissal)
  var rowEl=document.getElementById('sr-'+ei+'-'+si);
  if(rowEl){
    rowEl.style.opacity='0.65';
    var numEl=rowEl.querySelector('.set-num');
    if(numEl) numEl.classList.add('done');
    var logBtn=rowEl.querySelector('.btn-log-set');
    if(logBtn){ logBtn.style.background='rgba(61,220,132,0.22)'; logBtn.style.color='var(--green)'; }
  }

  // Haptic
  if(navigator.vibrate) navigator.vibrate([30,20,60]);

  // Smart focus advance + progressive reveal
  setTimeout(function(){
    _advanceFocusAfterLog(ei, si);
    updateProgressBar();
    _revealNextSet(ei);
  }, 80);
}

function _advanceFocusAfterLog(ei, si) {
  if(!G.sess) return;
  var ex = G.sess.exercises[ei];
  // Determine which working set index this is (0-based among non-warmup)
  var workingIdx = ex.sets.slice(0,si+1).filter(function(s){return !s.warmup;}).length - 1;

  // 1. AB mode: if AB set for this working index is pending, focus its reps input
  if(ex.abMode && ex.abExId) {
    var abRpEl = document.getElementById('abreps-'+ei+'-'+workingIdx);
    if(abRpEl){
      abRpEl.scrollIntoView({block:'center',behavior:'smooth'});
      abRpEl.focus(); abRpEl.select();
      return;
    }
  }

  // 2. SS group: advance to next exercise in the same SS group, same set round
  if(ex.ssGroup) {
    var ssPartners = G.sess.exercises.filter(function(e,i){
      return e.ssGroup===ex.ssGroup && i!==ei && e.linkedTo===undefined;
    });
    for(var p=0;p<ssPartners.length;p++){
      var pei = G.sess.exercises.indexOf(ssPartners[p]);
      var pex = ssPartners[p];
      // Find the next undone set in the partner at the same round
      var pWorkingSets = pex.sets.filter(function(s){return !s.warmup;});
      var nextPset = null, nextPsi = -1;
      pex.sets.forEach(function(s,i){
        if(!s.warmup && !s.done && nextPsi<0){
          nextPsi=i;
          nextPset=s;
        }
      });
      if(nextPsi>=0){
        var pWtEl = document.getElementById('wt-'+pei+'-'+nextPsi);
        var pRpEl = document.getElementById('reps-'+pei+'-'+nextPsi);
        // If weight already filled, go straight to reps; else weight
        var focusEl = (pWtEl && !pWtEl.value) ? pWtEl : pRpEl;
        if(focusEl){
          focusEl.scrollIntoView({block:'center',behavior:'smooth'});
          focusEl.focus(); focusEl.select();
          return;
        }
      }
    }
  }

  // 3. Default: next undone set in this same exercise (weight input)
  for(var i=si+1;i<ex.sets.length;i++){
    if(!ex.sets[i].done && !ex.sets[i].warmup){
      var inp=document.getElementById('wt-'+ei+'-'+i);
      if(inp){
        inp.scrollIntoView({block:'center',behavior:'smooth'});
        inp.focus(); inp.select();
        return;
      }
    }
  }

  // 4. All sets in this exercise done — flash the "Done with Exercise" button
  var doneBtn = document.querySelector('#exc-'+ei+' .btn-done-ex');
  if(doneBtn){
    doneBtn.style.transition='background 0.2s';
    doneBtn.style.background='rgba(61,220,132,0.28)';
    setTimeout(function(){ if(doneBtn) doneBtn.style.background=''; }, 800);
  }
}

function updateProgressBar() {
  if(!G.sess) return;
  var ts=G.sess.exercises.reduce(function(a,e){
    if(e.linkedTo!==undefined) return a;
    if(e.cardioData) return a+1;
    return a+(e.sets?e.sets.filter(function(x){return !x.warmup;}).length:0);
  },0);
  var ds=G.sess.exercises.reduce(function(a,e){
    if(e.linkedTo!==undefined) return a;
    if(e.cardioData) return a+(e.cardioData.done?1:0);
    return a+(e.sets?e.sets.filter(function(x){return x.done&&!x.warmup;}).length:0);
  },0);
  var bar=document.getElementById('sess-prog');
  if(bar) bar.style.width=(ts?Math.round(ds/ts*100):0)+'%';
}

function advanceFocus(event,ei,si,field){
  if(event.key!=='Enter'&&event.key!=='Tab')return;
  event.preventDefault();
  if(field==='weight'){
    var wtEl=document.getElementById('wt-'+ei+'-'+si);
    if(wtEl){ setField(ei,si,'weight',wtEl.value); wtEl.blur(); }
    // onWeightBlur handles focus-to-reps
  } else if(field==='reps'){
    var rpEl=document.getElementById('reps-'+ei+'-'+si);
    if(rpEl) setField(ei,si,'reps',rpEl.value);
    autoCompleteSet(ei,si);
  }
}

function toggleSet(ei,si) {
  if(!G.sess) return;
  var set=G.sess.exercises[ei].sets[si];
  set.done=!set.done;
  if(set.done && !set.warmup) startRestTimer(db.settings.defaultRestSecs||90, ei);
  renderSession();
}

/* === LOG SET BUTTON — explicit tap-driven log === */
function handleLogSet(ei, si, event) {
  event.preventDefault();
  event.stopPropagation();
  if(!G.sess) return;
  var ex = G.sess.exercises[ei];
  var set = ex.sets[si];
  if(set.done) return; // already logged, ignore
  // Read live DOM values
  var wtEl = document.getElementById('wt-'+ei+'-'+si);
  var rpEl = document.getElementById('reps-'+ei+'-'+si);
  var wVal = wtEl ? wtEl.value.trim() : set.weight;
  var rVal = rpEl ? rpEl.value.trim() : set.reps;
  // If weight empty — focus it and bail
  if(!wVal) {
    if(wtEl){ wtEl.focus(); wtEl.select(); }
    return;
  }
  // If reps empty — focus it and bail
  if(!rVal) {
    if(rpEl){ rpEl.focus(); rpEl.select(); }
    return;
  }
  set.weight = wVal;
  set.reps = rVal;
  set.done = true;
  // Cascade weight to next undone working sets (empty OR matching old value)
  var sets = ex.sets;
  for(var i = si+1; i < sets.length; i++){
    if(!sets[i].warmup && !sets[i].done){
      var sw = sets[i].weight||'';
      if(!sw || sw===wVal) {
        sets[i].weight = wVal;
      }
    }
  }
  if(!set.warmup) startRestTimer(db.settings.defaultRestSecs||90, ei);
  if(navigator.vibrate) navigator.vibrate([40,30,80]);

  // In-place DOM update (no re-render so keyboard stays)
  var rowEl=document.getElementById('sr-'+ei+'-'+si);
  if(rowEl){
    rowEl.style.opacity='0.65';
    var numEl=rowEl.querySelector('.set-num');
    if(numEl) numEl.classList.add('done');
    var logBtn=rowEl.querySelector('.btn-log-set');
    if(logBtn){ logBtn.style.background='rgba(61,220,132,0.22)'; logBtn.style.color='var(--green)'; }
  }

  // Smart focus advance + progressive set reveal
  setTimeout(function(){
    _advanceFocusAfterLog(ei, si);
    updateProgressBar();
    _revealNextSet(ei);
  }, 80);
}
function removeEx(ei) { if(!G.sess) return; G.sess.exercises.splice(ei,1); renderSession(); }

            ' AB '+(i+1)+': '+(loggedSet.weight?loggedSet.weight+' lbs × ':'')+loggedSet.reps+' reps'+

              '<div class="w-stepper-btn" ontouchstart="adjustAbWeight('+ei+','+i+',-5)" onclick="adjustAbWeight('+ei+','+i+',-5)">−</div>'+
              '<input class="w-stepper-inp" type="number" inputmode="decimal" placeholder="lbs" id="abwt-'+ei+'-'+i+'" value="'+lastAbW+'">'+
              '<div class="w-stepper-btn" ontouchstart="adjustAbWeight('+ei+','+i+',5)" onclick="adjustAbWeight('+ei+','+i+',5)">+</div>'+
            '</div>'+
            '<span style="font-size:11px;color:var(--t3)">×</span>'+
            '<input class="set-inp" type="number" inputmode="numeric" placeholder="reps" id="abreps-'+ei+'-'+i+'" value="" '+
              'style="max-width:64px" onkeydown="if(event.key===\'Enter\'){logAbSet('+ei+','+i+',event);event.preventDefault();}">'+
            '<button class="btn-log-set" style="max-width:60px"'+

              ' onclick="logAbSet('+ei+','+i+',event)">'+

            '</button>'+

    abRows += '</div>';
  }
  var pickerSection = (abOn && !abExId)
    ? '<div class="ab-picker-row" onclick="openAbPicker('+ei+')">'+

        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>'+
      '</div>'
    : '';
  return '<div class="ab-section">'+
    '<div class="ab-section-lbl">AB Mode'+
      '<div class="ab-toggle" onclick="toggleAbMode('+ei+')">'+

function logAbSet(ei, abIdx, event) {
  event.preventDefault(); event.stopPropagation();
  if(!G.sess) return;
  var ex = G.sess.exercises[ei];
  if(!ex.abExId) return;
  var wtEl = document.getElementById('abwt-'+ei+'-'+abIdx);
  var rpEl = document.getElementById('abreps-'+ei+'-'+abIdx);
  var weight = wtEl ? wtEl.value.trim() : '';
  var reps = rpEl ? rpEl.value.trim() : '';
  if(!reps){ if(rpEl){rpEl.focus();rpEl.select();} return; }
  // Find or create linked AB exercise entry
  var abEntry = G.sess.exercises.find(function(e){
    return e.exerciseId===ex.abExId && e.linkedTo===ei;
  });
  if(!abEntry) {
    var abDef = db.exercises.find(function(e){return e.id===ex.abExId;});
    abEntry = {exerciseId:ex.abExId, phase:ex.phase||'workout', linkedTo:ei, sets:[],
      equipOverride:[abDef?(abDef.equipment[0]||'bodyweight'):'bodyweight'], minimized:false};
    G.sess.exercises.push(abEntry);
  }
  while(abEntry.sets.length<=abIdx) abEntry.sets.push({weight:'',reps:'',done:false,warmup:false,placeholder:true});
  abEntry.sets[abIdx]={weight:weight,reps:reps,done:true,warmup:false,linkedSet:abIdx};
  if(navigator.vibrate) navigator.vibrate([30,20,60]);
  toast('✓ AB Set '+(abIdx+1)+': '+reps+' reps'+(weight?' @ '+weight+'lbs':''));
  renderSession();
}

function adjustAbWeight(ei, abIdx, delta) {
  var inp = document.getElementById('abwt-'+ei+'-'+abIdx);

  if(inp) inp.value = newVal%1===0?String(newVal):newVal.toFixed(1);
}
